<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 850 560" width="100%" height="100%">
  <defs>
    <style>
      .bg { fill: #f8fafc; }
      .title { font-family: 'Segoe UI', system-ui, sans-serif; font-size: 18px; font-weight: 700; fill: #0f172a; }
      .box { fill: #ffffff; stroke: #4f46e5; stroke-width: 1.5; rx: 6; }
      .entity-text { font-family: 'Segoe UI', system-ui, sans-serif; font-size: 12px; font-weight: 600; fill: #1e1b4b; text-anchor: middle; }
      .lifeline { stroke: #cbd5e1; stroke-width: 1.5; stroke-dasharray: 4; }
      .active-bar { fill: #e0e7ff; stroke: #4f46e5; stroke-width: 1.5; rx: 3; }
      .arrow { stroke: #1e293b; stroke-width: 1.5; marker-end: url(#arrowhead); }
      .return-arrow { stroke: #4f46e5; stroke-width: 1.5; stroke-dasharray: 4; marker-end: url(#arrowhead-blue); }
      .msg-text { font-family: 'Segoe UI', system-ui, sans-serif; font-size: 11px; fill: #1e293b; }
      .alt-box { fill: #f1f5f9; stroke: #94a3b8; stroke-width: 1; stroke-dasharray: 3; rx: 6; }
      .alt-title { font-family: 'Segoe UI', system-ui, sans-serif; font-size: 11px; font-weight: 700; fill: #475569; }
    </style>
    <marker id="arrowhead" markerWidth="8" markerHeight="6" refX="8" refY="3" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#1e293b"/>
    </marker>
    <marker id="arrowhead-blue" markerWidth="8" markerHeight="6" refX="8" refY="3" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#4f46e5"/>
    </marker>
  </defs>

  <rect width="850" height="560" class="bg"/>

  <text x="425" y="35" text-anchor="middle" class="title">Sequence Diagram: Multi-Role Login &amp; Session Routing</text>

  <!-- Entities -->
  <!-- User -->
  <rect x="50" y="60" width="100" height="35" class="box"/>
  <text x="100" y="82" class="entity-text">Pengguna</text>
  <line x1="100" y1="95" x2="100" y2="520" class="lifeline"/>

  <!-- View -->
  <rect x="220" y="60" width="120" height="35" class="box"/>
  <text x="280" y="82" class="entity-text">Login View (HTML)</text>
  <line x1="280" y1="95" x2="280" y2="520" class="lifeline"/>

  <!-- Auth Controller -->
  <rect x="400" y="60" width="120" height="35" class="box"/>
  <text x="460" y="82" class="entity-text">auth.js</text>
  <line x1="460" y1="95" x2="460" y2="520" class="lifeline"/>

  <!-- Supabase Auth -->
  <rect x="580" y="60" width="120" height="35" class="box"/>
  <text x="640" y="82" class="entity-text">Supabase Auth</text>
  <line x1="640" y1="95" x2="640" y2="520" class="lifeline"/>

  <!-- PostgreSQL -->
  <rect x="740" y="60" width="90" height="35" class="box"/>
  <text x="785" y="82" class="entity-text">PostgreSQL</text>
  <line x1="785" y1="95" x2="785" y2="520" class="lifeline"/>

  <!-- Active Lifelines -->
  <rect x="94" y="110" width="12" height="390" class="active-bar"/>
  <rect x="274" y="115" width="12" height="380" class="active-bar"/>
  <rect x="454" y="140" width="12" height="340" class="active-bar"/>
  <rect x="634" y="165" width="12" height="60" class="active-bar"/>
  <rect x="779" y="255" width="12" height="40" class="active-bar"/>

  <!-- Messages -->
  <!-- 1 -->
  <line x1="106" y1="120" x2="274" y2="120" class="arrow"/>
  <text x="115" y="115" class="msg-text">1. Input Email &amp; Password, klik "Masuk"</text>

  <!-- 2 -->
  <line x1="286" y1="145" x2="454" y2="145" class="arrow"/>
  <text x="295" y="140" class="msg-text">2. handleLogin(email, password)</text>

  <!-- 3 -->
  <line x1="466" y1="170" x2="634" y2="170" class="arrow"/>
  <text x="475" y="165" class="msg-text">3. signInWithPassword({email, password})</text>

  <!-- 4 -->
  <line x1="634" y1="210" x2="466" y2="210" class="return-arrow"/>
  <text x="475" y="205" class="msg-text">4. 200 OK (JWT Token, User Metadata)</text>

  <!-- 5 -->
  <line x1="466" y1="260" x2="779" y2="260" class="arrow"/>
  <text x="475" y="255" class="msg-text">5. SELECT role FROM public.users WHERE id = uid</text>

  <!-- 6 -->
  <line x1="779" y1="285" x2="466" y2="285" class="return-arrow"/>
  <text x="475" y="280" class="msg-text">6. { role: 'STUDENT' | 'UMKM' | 'ADMIN' }</text>

  <!-- Alt Box -->
  <rect x="230" y="320" width="600" height="150" class="alt-box"/>
  <text x="240" y="335" class="alt-title">[alt: Role Dispatching]</text>

  <text x="295" y="360" class="msg-text">if role == 'STUDENT': redirect('/pages/student/dashboard.html')</text>
  <text x="295" y="380" class="msg-text">else if role == 'UMKM': redirect('/pages/umkm/dashboard.html')</text>
  <text x="295" y="400" class="msg-text">else if role == 'ADMIN': redirect('/pages/admin/dashboard.html')</text>

  <!-- Final redirect -->
  <line x1="454" y1="430" x2="286" y2="430" class="return-arrow"/>
  <text x="295" y="425" class="msg-text">7. Simpan sesi di localStorage &amp; Redirect ke Dashboard</text>

  <line x1="274" y1="475" x2="106" y2="475" class="return-arrow"/>
  <text x="115" y="470" class="msg-text">8. Tampilkan Dashboard Portal</text>
</svg>
