
<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>My Projects — SkillBridge</title>
<link rel="stylesheet" href="../../assets/css/style.css">
<link rel="stylesheet" href="../../assets/css/components.css">
<style>
.sp-header{margin-bottom:26px}
.sp-header h1{font-size:clamp(27px,3vw,36px);font-weight:800;color:#0f172a;margin:0 0 8px}
.sp-header p{font-size:14px;line-height:1.6;color:#64748b;margin:0}
.sp-tabs{display:flex;flex-wrap:wrap;gap:10px;margin-bottom:25px;padding-bottom:16px;border-bottom:1px solid #e2e8f0}
.sp-tab{border:0;background:transparent;border-radius:11px;padding:11px 16px;font:inherit;font-size:13px;font-weight:700;color:#64748b;cursor:pointer}
.sp-tab.active{background:#eff6ff;color:#2563eb}
.sp-tab span{display:inline-block;padding:3px 8px;border-radius:999px;background:#e2e8f0;font-size:11px;margin-left:5px}
.sp-tab.active span{background:#2563eb;color:white}
.sp-card{background:#fff;border:1px solid #e2e8f0;border-radius:19px;padding:25px;margin-bottom:17px}
.sp-card-head{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap;margin-bottom:18px}
.sp-badges{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.sp-badge{padding:7px 12px;border-radius:999px;font-size:11px;font-weight:800;background:#f1f5f9;color:#475569}
.sp-badge.active{background:#dbeafe;color:#2563eb}
.sp-badge.pending{background:#fef3c7;color:#92400e}
.sp-badge.rejected{background:#fee2e2;color:#b91c1c}
.sp-badge.completed{background:#dcfce7;color:#15803d}
.sp-badge.revision{background:#ffedd5;color:#c2410c}
.sp-card h2{font-size:20px;color:#0f172a;font-weight:800;margin:0 0 10px}
.sp-desc{font-size:13px;line-height:1.7;color:#64748b;margin:0 0 17px;white-space:pre-line}
.sp-meta{display:flex;flex-wrap:wrap;gap:12px 20px;margin-bottom:20px;font-size:12px;color:#64748b}
.sp-meta strong{color:#334155}
.sp-review{background:#eff6ff;border:1px solid #bfdbfe;border-radius:11px;color:#1d4ed8;padding:13px 15px;font-size:12px;line-height:1.6;margin-bottom:18px}
.sp-review.revision{background:#fff7ed;border-color:#fed7aa;color:#9a3412}
.sp-review.completed{background:#f0fdf4;border-color:#bbf7d0;color:#166534}
.sp-progress{margin:16px 0}
.sp-progress-head{display:flex;justify-content:space-between;gap:8px;font-size:12px;color:#475569;font-weight:700;margin-bottom:9px}
.sp-progress-track{height:8px;background:#e2e8f0;border-radius:999px;overflow:hidden}
.sp-progress-fill{height:100%;background:#2563eb;border-radius:999px}
.sp-actions{display:flex;flex-wrap:wrap;align-items:center;gap:10px;border-top:1px solid #edf2f7;padding-top:19px;margin-top:20px}
.sp-button{display:inline-flex;align-items:center;justify-content:center;padding:12px 17px;border-radius:10px;background:#2563eb;color:#fff!important;font-size:12px;font-weight:800;text-decoration:none!important}
.sp-button.secondary{background:#eff6ff;color:#2563eb!important}
.sp-button:hover{filter:brightness(.96)}
.sp-state{background:#fff;border:1px solid #e2e8f0;border-radius:20px;padding:55px 20px;text-align:center}
.sp-state h3{color:#0f172a;margin:0 0 9px}
.sp-state p{font-size:13px;line-height:1.7;color:#64748b}
.sp-error{padding:15px;border:1px solid #fecaca;border-radius:12px;background:#fef2f2;color:#b91c1c;margin-bottom:20px;font-size:13px;white-space:pre-wrap}
@media(max-width:650px){.sp-card{padding:18px}.sp-tabs{flex-wrap:nowrap;overflow-x:auto}.sp-tab{white-space:nowrap}}
</style>
</head>

<body class="dashboard-body">
<div class="dashboard-layout">
  <aside class="dashboard-sidebar" id="shared-sidebar"></aside>
  <main class="dashboard-main">
    <header class="dashboard-topbar" id="shared-topbar"></header>
    <div class="dashboard-canvas">

      <div class="sp-header">
        <h1>My Projects</h1>
        <p>Track your industry collaborations, applications, and completed projects.</p>
      </div>

      <div class="sp-tabs" id="sp-tabs">
        <button type="button" class="sp-tab active" data-filter="active">
          Active Projects <span id="sp-count-active">0</span>
        </button>
        <button type="button" class="sp-tab" data-filter="pending">
          Pending <span id="sp-count-pending">0</span>
        </button>
        <button type="button" class="sp-tab" data-filter="rejected">
          Rejected <span id="sp-count-rejected">0</span>
        </button>
        <button type="button" class="sp-tab" data-filter="completed">
          Completed <span id="sp-count-completed">0</span>
        </button>
      </div>

      <div id="sp-error" hidden></div>

      <div id="sp-project-list">
        <div class="sp-state">
          <h3>Memuat proyek...</h3>
          <p>Sedang mengambil data dari Supabase.</p>
        </div>
      </div>

    </div>
  </main>
</div>

<script src="../../assets/vendor/supabase.js"></script>
<script src="../../assets/js/config.js"></script>
<script src="../../assets/js/supabase.js"></script>
<script src="../../assets/js/toast.js"></script>
<script src="../../assets/js/auth.js"></script>
<script src="../../assets/js/database.js"></script>
<script src="../../assets/js/settings.js"></script>
<script src="../../assets/js/layout.js"></script>

<script>
(() => {
  "use strict";

  const db = window.supabaseClient;
  const auth = window.SkillBridgeAuth;
  const list = document.getElementById("sp-project-list");
  const errorBox = document.getElementById("sp-error");

  let applications = [];
  let projectsById = {};
  let workspacesByProject = {};
  let filter = "active";

  const esc = value => String(value ?? "")
    .replace(/&/g, "&amp;")
    .replace(/</g, "&lt;")
    .replace(/>/g, "&gt;")
    .replace(/"/g, "&quot;")
    .replace(/'/g, "&#39;");

  const money = value =>
    "Rp " + Number(value || 0).toLocaleString("id-ID");

  function showError(message) {
    errorBox.hidden = false;
    errorBox.className = "sp-error";
    errorBox.textContent = message;
  }

  function showState(title, description) {
    list.innerHTML = `
      <div class="sp-state">
        <h3>${esc(title)}</h3>
        <p>${esc(description)}</p>
      </div>`;
  }

  function statusFor(app, workspace) {
    if (workspace?.review_state === "approved" ||
        workspace?.status === "completed") {
      return "completed";
    }

    const status = String(app.status || "pending").toLowerCase();

    if (status === "rejected") return "rejected";
    if (status === "accepted") return "active";
    if (status === "completed") return "completed";
    return "pending";
  }

  function reviewInformation(workspace) {
    if (!workspace) return "";

    const state = workspace.review_state || "working";

    if (state === "submitted") {
      return `
        <div class="sp-review">
          <strong>Menunggu Persetujuan UMKM</strong>
          <div>Hasil akhir sudah dikirim. UMKM sedang memeriksa pekerjaanmu.</div>
        </div>`;
    }

    if (state === "revision_requested") {
      return `
        <div class="sp-review revision">
          <strong>Revisi Diperlukan</strong>
          <div>${esc(
            workspace.revision_note ||
            "UMKM meminta perbaikan sebelum proyek dapat diselesaikan."
          )}</div>
        </div>`;
    }

    if (state === "approved") {
      return `
        <div class="sp-review completed">
          <strong>Project Approved</strong>
          <div>UMKM telah menyetujui hasil akhir pekerjaanmu.</div>
        </div>`;
    }

    return "";
  }

  function renderProjects() {
    const items = applications.map(app => {
      const project = projectsById[app.project_id] || {};
      const workspace = workspacesByProject[app.project_id] || null;

      return {
        app,
        project,
        workspace,
        status: statusFor(app, workspace)
      };
    });

    for (const status of ["active", "pending", "rejected", "completed"]) {
      const count = items.filter(item => item.status === status).length;
      const el = document.getElementById("sp-count-" + status);
      if (el) el.textContent = count;
    }

    const filtered = items.filter(item => item.status === filter);

    if (!filtered.length) {
      showState(
        "Belum Ada Proyek",
        filter === "active"
          ? "Belum ada proyek aktif. Periksa tab Pending atau jelajahi Market."
          : "Belum ada proyek dengan status ini."
      );
      return;
    }

    list.innerHTML = filtered.map(({ app, project, workspace, status }) => {
      const title = project.title || "Proyek Kolaborasi";
      const description = project.description || "";
      const progress = workspace
        ? Math.max(0, Math.min(100, Number(workspace.progress_percent || 0)))
        : 0;

      const labels = {
        active: "ACTIVE",
        pending: "PENDING",
        rejected: "REJECTED",
        completed: "COMPLETED"
      };

      const workspaceURL = workspace?.id
        ? "workspace.html?id=" + encodeURIComponent(workspace.id)
        : null;

      const review = reviewInformation(workspace);

      const actions = workspaceURL
        ? `
          <a href="${workspaceURL}" class="sp-button">
            ${status === "completed" ? "Lihat Workspace" :
              workspace.review_state === "revision_requested" ?
              "Kerjakan Revisi" : "Buka Workspace"}
          </a>
          ${status !== "completed" ? `
            <a href="${workspaceURL}&chat=1" class="sp-button secondary">
              Buka Chat
            </a>` : ""}
        `
        : status === "pending"
          ? `<a href="../projects.html" class="sp-button secondary">Jelajahi Market</a>`
          : status === "rejected"
            ? `<a href="../projects.html" class="sp-button secondary">Cari Proyek Lain</a>`
            : `<span style="font-size:12px;color:#64748b">
                 Lamaran sudah diterima. Workspace belum tersedia.
               </span>`;

      return `
        <article class="sp-card">
          <div class="sp-card-head">
            <div class="sp-badges">
              <span class="sp-badge ${status}">${labels[status]}</span>
              ${workspace?.review_state === "revision_requested"
                ? `<span class="sp-badge revision">REVISION</span>` : ""}
              ${workspace?.review_state === "submitted"
                ? `<span class="sp-badge pending">AWAITING REVIEW</span>` : ""}
            </div>
            <strong style="font-size:14px;color:#0f172a">
              ${money(project.budget)}
            </strong>
          </div>

          <h2>${esc(title)}</h2>
          <p class="sp-desc">${esc(description)}</p>

          ${review}

          <div class="sp-meta">
            <span><strong>Lokasi:</strong> ${esc(project.location || "-")}</span>
            <span><strong>Status Lamaran:</strong> ${esc(app.status || "pending")}</span>
            <span><strong>Status Workspace:</strong> ${esc(workspace?.status || "-")}</span>
          </div>

          ${workspace && status === "active" ? `
            <div class="sp-progress">
              <div class="sp-progress-head">
                <span>Progress Proyek</span>
                <span>${progress}%</span>
              </div>
              <div class="sp-progress-track">
                <div class="sp-progress-fill" style="width:${progress}%"></div>
              </div>
            </div>` : ""}

          <div class="sp-actions">${actions}</div>
        </article>`;
    }).join("");
  }

  async function loadProjects() {
    showState("Memuat proyek...", "Sedang mengambil data dari Supabase.");
    errorBox.hidden = true;

    try {
      if (!db || !auth) {
        throw new Error("Supabase atau Auth belum siap.");
      }

      await auth.ready();
      const user = await auth.requireAuth("student");
      if (!user?.id) {
        throw new Error("Sesi Student tidak ditemukan. Silakan login kembali.");
      }

      // Ambil lamaran milik student yang sedang login.
      const appResult = await db
        .from("project_applications")
        .select("*")
        .eq("student_id", user.id)
        .order("created_at", { ascending: false });

      if (appResult.error) throw appResult.error;

      applications = appResult.data || [];
      projectsById = {};
      workspacesByProject = {};

      const projectIds = [...new Set(
        applications.map(app => app.project_id).filter(Boolean)
      )];

      if (projectIds.length) {
        const [projectsResult, workspacesResult] = await Promise.all([
          db.from("projects")
            .select("id,title,description,budget,location,status")
            .in("id", projectIds),

          db.from("workspaces")
            .select("id,project_id,student_id,status,review_state,revision_note,progress_percent")
            .eq("student_id", user.id)
            .in("project_id", projectIds)
        ]);

        if (projectsResult.error) {
          console.warn("[Student Projects]", projectsResult.error);
          showError("Sebagian detail proyek tidak dapat dibaca: " +
            projectsResult.error.message);
        } else {
          for (const project of projectsResult.data || []) {
            projectsById[project.id] = project;
          }
        }

        if (workspacesResult.error) {
          console.warn("[Student Workspaces]", workspacesResult.error);
          showError("Workspace gagal dimuat: " + workspacesResult.error.message);
        } else {
          for (const workspace of workspacesResult.data || []) {
            workspacesByProject[workspace.project_id] = workspace;
          }
        }
      }

      renderProjects();

    } catch (error) {
      console.error("[Student My Projects]", error);
      showError("Gagal memuat proyek: " + error.message);
      list.innerHTML = "";
    }
  }

  document.getElementById("sp-tabs").addEventListener("click", event => {
    const button = event.target.closest("[data-filter]");
    if (!button) return;

    filter = button.dataset.filter;

    document.querySelectorAll(".sp-tab").forEach(tab => {
      tab.classList.toggle("active", tab === button);
    });

    renderProjects();
  });

  function init() {
    loadProjects();
  }

  if (document.readyState === "loading") {
    document.addEventListener("DOMContentLoaded", init, { once: true });
  } else {
    init();
  }
})();
</script>
</body>
</html>
