
<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Marketplace — SkillBridge</title>

  <link rel="stylesheet" href="../assets/css/style.css">
  <link rel="stylesheet" href="../assets/css/components.css">

  <style>
    .market-page-title {
      font-size: 2rem;
      font-weight: 800;
      color: #0f172a;
      margin: 0 0 8px;
    }

    .market-page-subtitle {
      color: #64748b;
      font-size: 14px;
      margin: 0 0 27px;
    }

    .market-filter-card {
      background: white;
      border: 1px solid #e2e8f0;
      border-radius: 18px;
      padding: 17px;
      display: flex;
      align-items: center;
      gap: 15px;
      margin-bottom: 25px;
    }

    .market-search-input,
    .market-category-select {
      padding: 13px 15px;
      border: 1px solid #e2e8f0;
      border-radius: 11px;
      background: #f8fafc;
      color: #334155;
      font-size: 13px;
      outline: none;
    }

    .market-search-input {
      flex: 1;
      min-width: 0;
    }

    .market-category-select {
      width: 220px;
    }

    .market-project-card {
      background: white;
      border: 1px solid #e2e8f0;
      border-radius: 19px;
      padding: 25px;
      margin-bottom: 18px;
    }

    .market-card-header {
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      flex-wrap: wrap;
      gap: 16px;
      margin-bottom: 16px;
    }

    .market-card-company {
      display: flex;
      align-items: center;
      gap: 13px;
    }

    .market-company-avatar {
      width: 51px;
      height: 51px;
      background: #eff6ff;
      color: #2563eb;
      border-radius: 14px;
      display: grid;
      place-items: center;
      font-size: 22px;
      font-weight: 800;
      flex-shrink: 0;
    }

    .company-name-text {
      color: #64748b;
      font-size: 12px;
      font-weight: 600;
      margin-bottom: 5px;
    }

    .project-title-text {
      color: #0f172a;
      font-size: 19px;
      font-weight: 800;
      line-height: 1.4;
      margin: 0;
    }

    .project-stipend-badge {
      background: #eff6ff;
      color: #2563eb;
      font-size: 13px;
      font-weight: 800;
      border-radius: 10px;
      padding: 11px 15px;
    }

    .market-description {
      color: #64748b;
      font-size: 13px;
      line-height: 1.8;
      margin: 0 0 17px;
      white-space: pre-line;
      overflow-wrap: anywhere;
    }

    .skill-tags-group {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      margin-bottom: 19px;
    }

    .skill-tag-pill {
      background: #f1f5f9;
      color: #475569;
      padding: 7px 11px;
      border-radius: 8px;
      font-size: 11px;
      font-weight: 700;
    }

    .project-meta-row {
      display: flex;
      flex-wrap: wrap;
      gap: 19px;
      color: #64748b;
      font-size: 12px;
      padding: 15px 0;
      border-top: 1px solid #edf2f7;
      margin-bottom: 13px;
    }

    .project-meta-row strong {
      color: #334155;
    }

    .market-action {
      display: inline-flex;
      justify-content: center;
      align-items: center;
      text-align: center;
      border-radius: 11px;
      padding: 13px 20px;
      font-weight: 700;
      background: #2563eb;
      color: white;
      text-decoration: none;
      font-size: 13px;
    }

    .market-action:hover {
      background: #1d4ed8;
      color: white;
    }

    .market-state {
      text-align: center;
      background: white;
      border: 1px solid #e2e8f0;
      border-radius: 18px;
      padding: 55px 20px;
    }

    .market-state h3 {
      color: #0f172a;
      margin: 0 0 12px;
    }

    .market-state p {
      color: #64748b;
      font-size: 13px;
      line-height: 1.7;
    }

    .market-error {
      background: #fef2f2;
      border: 1px solid #fecaca;
      color: #b91c1c;
      border-radius: 12px;
      padding: 16px;
      margin-bottom: 20px;
      font-size: 13px;
    }

    @media (max-width: 700px) {
      .market-filter-card {
        flex-direction: column;
        align-items: stretch;
      }

      .market-category-select {
        width: 100%;
      }

      .market-project-card {
        padding: 19px;
      }

      .market-page-title {
        font-size: 26px;
      }
    }
  </style>
</head>

<body class="dashboard-body">

  <div class="dashboard-layout">

    <!-- SIDEBAR -->
    <aside
      class="dashboard-sidebar"
      id="shared-sidebar">
    </aside>

    <!-- MAIN -->
    <main class="dashboard-main">

      <header
        class="dashboard-topbar"
        id="shared-topbar">
      </header>

      <div class="dashboard-canvas">

        <h1 class="market-page-title">
          Make Your Portfolio Now!
        </h1>

        <p class="market-page-subtitle">
          Temukan proyek UMKM yang sesuai
          dengan minat dan keahlianmu.
        </p>

        <!-- SEARCH & FILTER -->
        <div class="market-filter-card">

          <input
            type="search"
            id="marketSearchInput"
            class="market-search-input"
            placeholder="Search projects, companies, or skills..."
          >

          <select
            id="marketCategorySelect"
            class="market-category-select">
            <option value="all">
              Semua Kategori
            </option>
          </select>

        </div>

        <!-- REAL PROJECTS -->
        <div id="market-projects-container">
          <div class="market-state">
            <h3>Loading projects...</h3>
            <p>Mengambil proyek dari Supabase.</p>
          </div>
        </div>

      </div>
    </main>

  </div>

  <!-- DEPENDENCIES -->
  <script src="../assets/vendor/supabase.js"></script>
  <script src="../assets/js/config.js"></script>
  <script src="../assets/js/supabase.js"></script>
  <script src="../assets/js/toast.js"></script>
  <script src="../assets/js/auth.js"></script>
  <script src="../assets/js/database.js"></script>
  <script src="../assets/js/settings.js"></script>
  <script src="../assets/js/layout.js"></script>

  <script>
    "use strict";

    const db = window.supabaseClient;

    const container = document.getElementById(
      "market-projects-container"
    );

    const searchInput = document.getElementById(
      "marketSearchInput"
    );

    const categorySelect = document.getElementById(
      "marketCategorySelect"
    );

    let allProjects = [];

    // ======================================
    // HELPERS
    // ======================================

    function esc(value) {
      return String(value ?? "")
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;")
        .replace(/'/g, "&#39;");
    }

    function formatMoney(amount) {
      const value = Number(amount);

      if (!Number.isFinite(value) || value <= 0) {
        return "Budget tidak dicantumkan";
      }

      return "Rp " + value.toLocaleString("id-ID");
    }

    function formatDate(value) {
      if (!value) return "Tidak ditentukan";

      const date = new Date(
        String(value).length === 10
          ? value + "T00:00:00"
          : value
      );

      if (Number.isNaN(date.getTime())) {
        return "Tidak ditentukan";
      }

      return date.toLocaleDateString("id-ID", {
        day: "numeric",
        month: "short",
        year: "numeric"
      });
    }

    function showError(error) {
      container.innerHTML = `
        <div class="market-error">
          Gagal memuat Marketplace:
          ${esc(error.message || error)}
        </div>
      `;
    }

    // ======================================
    // LOAD PROJECTS FROM SUPABASE
    // ======================================

    async function loadProjects() {
      container.innerHTML = `
        <div class="market-state">
          <h3>Loading projects...</h3>
          <p>Mengambil data terbaru dari Supabase.</p>
        </div>
      `;

      try {
        if (!db) {
          throw new Error(
            "Supabase client tidak tersedia."
          );
        }

        if (
          typeof window.SkillBridgeAuth?.ready ===
          "function"
        ) {
          await window.SkillBridgeAuth.ready();
        }

        // FIX:
        // Avatar sekarang dikelola oleh layout.js.
        // Jangan memakai elemen #market-avatar
        // karena elemen tersebut sudah tidak ada.

        // Ambil proyek recruiting dari Supabase.
        const {
          data: projects,
          error: projectsError
        } = await db
          .from("projects")
          .select("*")
          .eq("status", "recruiting")
          .order("created_at", {
            ascending: false
          });

        if (projectsError) {
          throw projectsError;
        }

        allProjects = projects || [];

        // ==================================
        // LOAD CATEGORIES
        // ==================================

        const categoryIds = [
          ...new Set(
            allProjects
              .map(project => project.category_id)
              .filter(Boolean)
          )
        ];

        const categoriesById = {};

        if (categoryIds.length) {
          const {
            data: categories,
            error: categoryError
          } = await db
            .from("categories")
            .select("id,name")
            .in("id", categoryIds);

          if (categoryError) {
            console.warn(
              "Could not load categories:",
              categoryError
            );
          } else {
            (categories || []).forEach(category => {
              categoriesById[category.id] =
                category.name;
            });
          }
        }

        // ==================================
        // LOAD BUSINESS PROFILES
        // ==================================

        const ownerIds = [
          ...new Set(
            allProjects
              .map(project => project.owner_id)
              .filter(Boolean)
          )
        ];

        const businessesById = {};

        if (ownerIds.length) {
          const {
            data: businesses,
            error: businessError
          } = await db
            .from("public_umkm_profiles")
            .select("user_id,company_name,city")
            .in("user_id", ownerIds);

          if (businessError) {
            console.warn(
              "Could not load business profiles:",
              businessError
            );
          } else {
            (businesses || []).forEach(business => {
              businessesById[business.user_id] =
                business;
            });
          }
        }

        // ==================================
        // ENRICH PROJECT DATA
        // ==================================

        allProjects = allProjects.map(project => ({
          ...project,

          category_name:
            categoriesById[project.category_id] ||
            "Uncategorized",

          business_name:
            businessesById[project.owner_id]
              ?.company_name ||
            "Nama bisnis belum dilengkapi",

          business_city:
            businessesById[project.owner_id]
              ?.city ||
            project.location ||
            null
        }));

        // ==================================
        // CATEGORY FILTER OPTIONS
        // ==================================

        const categoryNames = [
          ...new Set(
            allProjects.map(
              project => project.category_name
            )
          )
        ].filter(Boolean).sort();

        categorySelect.innerHTML =
          '<option value="all">Semua Kategori</option>';

        categoryNames.forEach(name => {
          const option = document.createElement(
            "option"
          );

          option.value = name;
          option.textContent = name;

          categorySelect.appendChild(option);
        });

        renderProjects();

      } catch (error) {
        console.error(
          "[SkillBridge Marketplace]",
          error
        );

        showError(error);
      }
    }

    // ======================================
    // RENDER PROJECT CARDS
    // ======================================

    function renderProjects() {
      const search = searchInput.value
        .trim()
        .toLowerCase();

      const category = categorySelect.value;

      const filtered = allProjects.filter(project => {
        const text = [
          project.title,
          project.description,
          project.business_name,
          project.category_name,
          ...(Array.isArray(project.required_skills)
            ? project.required_skills
            : [])
        ].join(" ").toLowerCase();

        const matchesSearch =
          text.includes(search);

        const matchesCategory =
          category === "all" ||
          project.category_name === category;

        return matchesSearch && matchesCategory;
      });

      // ==================================
      // EMPTY STATE
      // ==================================

      if (!filtered.length) {
        container.innerHTML = `
          <div class="market-state">
            <h3>Tidak ada proyek yang ditemukan</h3>
            <p>
              ${allProjects.length === 0
                ? "Belum ada proyek recruiting yang dapat diakses."
                : "Coba ubah kata pencarian atau kategori."}
            </p>
          </div>
        `;

        return;
      }

      // ==================================
      // DISPLAY PROJECT CARDS
      // ==================================

      container.innerHTML = filtered.map(project => {
        const skills = Array.isArray(
          project.required_skills
        )
          ? project.required_skills
          : [];

        const skillsHTML = skills.map(skill => `
          <span class="skill-tag-pill">
            ${esc(skill)}
          </span>
        `).join("");

        const name = project.business_name;

        const initial =
          name === "Nama bisnis belum dilengkapi"
            ? "U"
            : name.charAt(0).toUpperCase();

        const duration =
          Number(project.duration_weeks) > 0
            ? `${project.duration_weeks} Minggu`
            : "Tidak ditentukan";

        const difficulty =
          project.difficulty_level ||
          "Tidak ditentukan";

        return `
          <article class="market-project-card">

            <div class="market-card-header">

              <div class="market-card-company">

                <div class="market-company-avatar">
                  ${esc(initial)}
                </div>

                <div>
                  <div class="company-name-text">
                    ${esc(name)}
                  </div>

                  <h3 class="project-title-text">
                    ${esc(project.title)}
                  </h3>
                </div>

              </div>

              <div class="project-stipend-badge">
                ${esc(formatMoney(project.budget))}
              </div>

            </div>

            <p class="market-description">
              ${esc(project.description)}
            </p>

            <div class="skill-tags-group">
              ${skillsHTML}
            </div>

            <div class="project-meta-row">

              <span>
                <strong>Kategori:</strong>
                ${esc(project.category_name)}
              </span>

              <span>
                <strong>Lokasi:</strong>
                ${esc(
                  project.location ||
                  "Tidak dicantumkan"
                )}
              </span>

              <span>
                <strong>Durasi:</strong>
                ${esc(duration)}
              </span>

              <span>
                <strong>Level:</strong>
                ${esc(difficulty)}
              </span>

              <span>
                <strong>Deadline:</strong>
                ${esc(formatDate(project.deadline))}
              </span>

            </div>

            <a
              href="project-detail.html?id=${encodeURIComponent(project.id)}"
              class="market-action">
              Lihat Detail & Lamar
            </a>

          </article>
        `;
      }).join("");
    }

    // ======================================
    // SEARCH EVENTS
    // ======================================

    searchInput.addEventListener(
      "input",
      renderProjects
    );

    categorySelect.addEventListener(
      "change",
      renderProjects
    );

    // ======================================
    // INITIAL LOAD
    // ======================================

    document.addEventListener(
      "DOMContentLoaded",
      loadProjects
    );
  </script>

</body>
</html>
