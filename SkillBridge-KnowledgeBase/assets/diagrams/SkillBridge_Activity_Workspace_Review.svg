<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 850 720" width="100%" height="100%">
  <defs>
    <style>
      .bg { fill: #f8fafc; }
      .title { font-family: 'Segoe UI', system-ui, sans-serif; font-size: 18px; font-weight: 700; fill: #0f172a; }
      .swimlane { fill: #ffffff; stroke: #cbd5e1; stroke-width: 1.5; }
      .swimlane-header { font-family: 'Segoe UI', system-ui, sans-serif; font-size: 14px; font-weight: 700; fill: #1e1b4b; text-anchor: middle; }
      .act-node { fill: #ffffff; stroke: #4f46e5; stroke-width: 1.5; rx: 16; }
      .act-text { font-family: 'Segoe UI', system-ui, sans-serif; font-size: 11px; font-weight: 500; fill: #1e293b; text-anchor: middle; dominant-baseline: middle; }
      .decision { fill: #fef3c7; stroke: #d97706; stroke-width: 1.5; }
      .start-node { fill: #10b981; stroke: #047857; stroke-width: 2; }
      .stop-node { fill: #ef4444; stroke: #b91c1c; stroke-width: 2; }
      .stop-outer { fill: none; stroke: #ef4444; stroke-width: 2; }
      .flow-arrow { stroke: #475569; stroke-width: 1.5; marker-end: url(#arrowhead); }
      .branch-text { font-family: 'Segoe UI', system-ui, sans-serif; font-size: 11px; font-weight: 600; fill: #d97706; }
    </style>
    <marker id="arrowhead" markerWidth="8" markerHeight="6" refX="8" refY="3" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#475569"/>
    </marker>
  </defs>

  <rect width="850" height="720" class="bg"/>

  <text x="425" y="32" text-anchor="middle" class="title">Activity Diagram: Kolaborasi Ruang Kerja &amp; Ulasan Dua Arah</text>

  <!-- Swimlanes -->
  <!-- Lane 1: Mahasiswa -->
  <rect x="40" y="50" width="250" height="640" class="swimlane"/>
  <rect x="40" y="50" width="250" height="35" fill="#eef2ff" stroke="#cbd5e1" stroke-width="1.5"/>
  <text x="165" y="73" class="swimlane-header">Mahasiswa (Talenta)</text>

  <!-- Lane 2: Sistem Platform -->
  <rect x="290" y="50" width="270" height="640" class="swimlane"/>
  <rect x="290" y="50" width="270" height="35" fill="#f0fdf4" stroke="#cbd5e1" stroke-width="1.5"/>
  <text x="425" y="73" class="swimlane-header">Sistem Platform (Supabase)</text>

  <!-- Lane 3: Pemilik UMKM -->
  <rect x="560" y="50" width="250" height="640" class="swimlane"/>
  <rect x="560" y="50" width="250" height="35" fill="#fffbeb" stroke="#cbd5e1" stroke-width="1.5"/>
  <text x="685" y="73" class="swimlane-header">Pemilik UMKM (Mitra)</text>

  <!-- Start Node -->
  <circle cx="165" cy="110" r="10" class="start-node"/>

  <!-- Step 1: Coordination -->
  <line x1="165" y1="120" x2="165" y2="145" class="flow-arrow"/>
  <rect x="65" y="145" width="200" height="36" class="act-node"/>
  <text x="165" y="163" class="act-text">Koordinasi via Chat Realtime</text>

  <!-- Step 2: Checklist task -->
  <line x1="165" y1="181" x2="165" y2="210" class="flow-arrow"/>
  <rect x="65" y="210" width="200" height="36" class="act-node"/>
  <text x="165" y="228" class="act-text">Centang Tugas Selesai</text>

  <!-- Sync System -->
  <line x1="265" y1="228" x2="325" y2="228" class="flow-arrow"/>
  <rect x="325" y="210" width="200" height="36" class="act-node"/>
  <text x="425" y="228" class="act-text">Hitung &amp; Broadcast Progress %</text>

  <!-- Deliverable submission -->
  <line x1="165" y1="246" x2="165" y2="280" class="flow-arrow"/>
  <rect x="65" y="280" width="200" height="36" class="act-node"/>
  <text x="165" y="298" class="act-text">Submit Tautan Deliverable Akhir</text>

  <!-- Review by UMKM -->
  <line x1="265" y1="298" x2="585" y2="298" class="flow-arrow"/>
  <rect x="585" y="280" width="200" height="36" class="act-node"/>
  <text x="685" y="298" class="act-text">Periksa Kelengkapan Deliverable</text>

  <!-- Decision by UMKM -->
  <line x1="685" y1="316" x2="685" y2="350" class="flow-arrow"/>
  <polygon points="685,350 730,375 685,400 640,375" class="decision"/>
  <text x="685" y="378" font-size="10" font-weight="600" text-anchor="middle">Sesuai?</text>

  <!-- Revision Loop -->
  <line x1="640" y1="375" x2="165" y2="375" class="flow-arrow"/>
  <text x="480" y="365" class="branch-text">[Perlu Revisi: Kirim Feedback]</text>
  <line x1="165" y1="375" x2="165" y2="316" class="flow-arrow"/>

  <!-- Selesai Branch -->
  <line x1="685" y1="400" x2="685" y2="435" class="flow-arrow"/>
  <text x="695" y="415" class="branch-text">[Selesai]</text>
  <rect x="585" y="435" width="200" height="36" class="act-node"/>
  <text x="685" y="453" class="act-text">Klik "Selesaikan Proyek"</text>

  <!-- System marks COMPLETED -->
  <line x1="585" y1="453" x2="525" y2="453" class="flow-arrow"/>
  <rect x="315" y="435" width="220" height="36" class="act-node"/>
  <text x="425" y="453" class="act-text">Status: COMPLETED</text>

  <!-- Prompt Two-way review -->
  <line x1="425" y1="471" x2="425" y2="505" class="flow-arrow"/>
  <rect x="315" y="505" width="220" height="36" class="act-node"/>
  <text x="425" y="523" class="act-text">Buka Modal Ulasan 2 Arah</text>

  <!-- Student Reviews UMKM -->
  <line x1="315" y1="523" x2="265" y2="523" class="flow-arrow"/>
  <rect x="65" y="505" width="200" height="36" class="act-node"/>
  <text x="165" y="523" class="act-text">Beri Rating &amp; Testimoni UMKM</text>

  <!-- UMKM Reviews Student -->
  <line x1="535" y1="523" x2="585" y2="523" class="flow-arrow"/>
  <rect x="585" y="505" width="200" height="36" class="act-node"/>
  <text x="685" y="523" class="act-text">Beri Rating &amp; Testimoni Mahasiswa</text>

  <!-- Both save to DB and calculate score -->
  <line x1="165" y1="541" x2="165" y2="590" class="flow-arrow"/>
  <line x1="685" y1="541" x2="685" y2="590" class="flow-arrow"/>
  <line x1="165" y1="590" x2="315" y2="590" class="flow-arrow"/>
  <line x1="685" y1="590" x2="535" y2="590" class="flow-arrow"/>

  <rect x="315" y="572" width="220" height="36" class="act-node"/>
  <text x="425" y="590" class="act-text">Update Skor Portofolio Mahasiswa</text>

  <!-- Stop Node -->
  <line x1="425" y1="608" x2="425" y2="650" class="flow-arrow"/>
  <circle cx="425" cy="660" r="14" class="stop-outer"/>
  <circle cx="425" cy="660" r="8" class="stop-node"/>
</svg>
