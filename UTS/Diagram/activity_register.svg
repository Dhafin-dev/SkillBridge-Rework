<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 850 720" width="100%" height="100%">
  <defs>
    <style>
      .bg { fill: #f8fafc; }
      .header-box { fill: #1e1b4b; rx: 8; }
      .header-title { font-family: 'Segoe UI', system-ui, sans-serif; font-size: 17px; font-weight: 700; fill: #ffffff; text-anchor: middle; }
      .header-sub { font-family: 'Segoe UI', system-ui, sans-serif; font-size: 11px; fill: #c7d2fe; text-anchor: middle; }
      .swimlane { fill: #ffffff; stroke: #cbd5e1; stroke-width: 1.5; }
      .lane-title { font-family: 'Segoe UI', system-ui, sans-serif; font-size: 13px; font-weight: 700; text-anchor: middle; }
      .act-node { fill: #ffffff; stroke: #4f46e5; stroke-width: 1.5; rx: 8; }
      .act-node-sys { fill: #ecfdf5; stroke: #10b981; stroke-width: 1.5; rx: 8; }
      .act-node-db { fill: #f1f5f9; stroke: #64748b; stroke-width: 1.5; rx: 8; }
      .node-txt { font-family: 'Segoe UI', system-ui, sans-serif; font-size: 11px; font-weight: 600; fill: #0f172a; text-anchor: middle; dominant-baseline: middle; }
      .node-sub { font-family: 'Segoe UI', system-ui, sans-serif; font-size: 9.5px; fill: #475569; text-anchor: middle; }
      .decision { fill: #fef3c7; stroke: #d97706; stroke-width: 1.5; }
      .dec-txt { font-family: 'Segoe UI', system-ui, sans-serif; font-size: 10px; font-weight: 600; fill: #92400e; text-anchor: middle; dominant-baseline: middle; }
      .start-node { fill: #10b981; stroke: #047857; stroke-width: 2.5; }
      .stop-outer { fill: none; stroke: #ef4444; stroke-width: 2; }
      .stop-inner { fill: #ef4444; }
      .arrow { stroke: #64748b; stroke-width: 1.5; fill: none; marker-end: url(#arrowhead); }
      .arrow-err { stroke: #ef4444; stroke-width: 1.5; fill: none; stroke-dasharray: 4,3; marker-end: url(#arrowhead-red); }
      .branch-lbl { font-family: 'Segoe UI', system-ui, sans-serif; font-size: 9.5px; font-weight: 700; fill: #059669; }
      .branch-lbl-red { font-family: 'Segoe UI', system-ui, sans-serif; font-size: 9.5px; font-weight: 700; fill: #dc2626; }
    </style>
    <marker id="arrowhead" markerWidth="7" markerHeight="5" refX="7" refY="2.5" orient="auto">
      <polygon points="0 0, 7 2.5, 0 5" fill="#64748b"/>
    </marker>
    <marker id="arrowhead-red" markerWidth="7" markerHeight="5" refX="7" refY="2.5" orient="auto">
      <polygon points="0 0, 7 2.5, 0 5" fill="#ef4444"/>
    </marker>
  </defs>

  <rect width="850" height="720" class="bg"/>

  <!-- Header Banner -->
  <rect x="25" y="15" width="800" height="48" class="header-box"/>
  <text x="425" y="36" class="header-title">Activity Diagram: Registrasi Akun Pengguna Multi-Peran</text>
  <text x="425" y="52" class="header-sub">Platform SkillBridge: Pendaftaran Mahasiswa &amp; UMKM via Supabase Auth &amp; PostgreSQL</text>

  <!-- Swimlanes -->
  <!-- Lane 1: Calon Pengguna -->
  <rect x="25" y="70" width="260" height="625" class="swimlane"/>
  <rect x="25" y="70" width="260" height="32" fill="#e0e7ff" stroke="#cbd5e1" stroke-width="1.5"/>
  <text x="155" y="91" fill="#312e81" class="lane-title">Calon Pengguna (User)</text>

  <!-- Lane 2: Frontend & Auth Controller -->
  <rect x="285" y="70" width="275" height="625" class="swimlane"/>
  <rect x="285" y="70" width="275" height="32" fill="#d1fae5" stroke="#cbd5e1" stroke-width="1.5"/>
  <text x="422" y="91" fill="#065f46" class="lane-title">Frontend App &amp; Supabase Auth</text>

  <!-- Lane 3: Database PostgreSQL -->
  <rect x="560" y="70" width="265" height="625" class="swimlane"/>
  <rect x="560" y="70" width="265" height="32" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="1.5"/>
  <text x="692" y="91" fill="#334155" class="lane-title">Database (PostgreSQL 15+)</text>

  <!-- Start Node -->
  <circle cx="155" cy="125" r="10" class="start-node"/>

  <!-- Step 1: Open Register Page -->
  <path d="M 155 135 L 155 155" class="arrow"/>
  <rect x="55" y="155" width="200" height="38" class="act-node"/>
  <text x="155" y="174" class="node-txt">Buka Halaman Registrasi</text>

  <!-- Step 2: Select Role & Fill Form -->
  <path d="M 155 193 L 155 215" class="arrow"/>
  <rect x="55" y="215" width="200" height="42" class="act-node"/>
  <text x="155" y="231" class="node-txt">Pilih Role (Student / UMKM)</text>
  <text x="155" y="246" class="node-sub">Isi nama, email, password &amp; profil</text>

  <!-- Step 3: Click Submit -->
  <path d="M 155 257 L 155 280" class="arrow"/>
  <rect x="55" y="280" width="200" height="38" class="act-node"/>
  <text x="155" y="299" class="node-txt">Klik Tombol "Daftar Akun"</text>

  <!-- Client Validation -->
  <path d="M 255 299 L 320 299" class="arrow"/>
  <rect x="320" y="280" width="205" height="38" class="act-node-sys"/>
  <text x="422" y="299" class="node-txt">Validasi Format Email &amp; Password</text>

  <!-- Decision: Valid Input? -->
  <path d="M 422 318 L 422 340" class="arrow"/>
  <polygon points="422,340 472,362 422,384 372,362" class="decision"/>
  <text x="422" y="365" class="dec-txt">Format Valid?</text>

  <!-- Branch No -> Toast Error -->
  <path d="M 372 362 L 155 362 L 155 257" class="arrow-err"/>
  <text x="210" y="355" class="branch-lbl-red">[Tidak: Tampilkan Error]</text>

  <!-- Branch Yes -> GoTrue SignUp -->
  <path d="M 422 384 L 422 408" class="arrow"/>
  <text x="430" y="398" class="branch-lbl">[Ya]</text>
  <rect x="320" y="408" width="205" height="42" class="act-node-sys"/>
  <text x="422" y="424" class="node-txt">supabase.auth.signUp()</text>
  <text x="422" y="439" class="node-sub">Enkripsi password &amp; create auth.users</text>

  <!-- Check Email Uniqueness -->
  <path d="M 525 429 L 595 429" class="arrow"/>
  <rect x="595" y="408" width="195" height="42" class="act-node-db"/>
  <text x="692" y="424" class="node-txt">Cek Duplikasi Email</text>
  <text x="692" y="439" class="node-sub">Kueri SELECT auth.users(email)</text>

  <!-- Decision: Email Unik? -->
  <path d="M 692 450 L 692 470" class="arrow"/>
  <polygon points="692,470 742,492 692,514 642,492" class="decision"/>
  <text x="692" y="495" class="dec-txt">Email Unik?</text>

  <!-- Duplicate -> Error Toast -->
  <path d="M 642 492 L 422 492 L 422 450" class="arrow-err"/>
  <text x="500" y="485" class="branch-lbl-red">[Duplikat: Error 422]</text>

  <!-- Unique -> Insert Public Tables -->
  <path d="M 692 514 L 692 538" class="arrow"/>
  <text x="700" y="528" class="branch-lbl">[Ya]</text>
  <rect x="595" y="538" width="195" height="42" class="act-node-db"/>
  <text x="692" y="554" class="node-txt">INSERT INTO public.users</text>
  <text x="692" y="569" class="node-sub">Trigger insert student/umkm_profile</text>

  <!-- Return Success to Frontend -->
  <path d="M 595 559 L 525 559" class="arrow"/>
  <rect x="320" y="538" width="205" height="42" class="act-node-sys"/>
  <text x="422" y="554" class="node-txt">Tampilkan Toast Sukses</text>
  <text x="422" y="569" class="node-sub">Pengalihan ke /pages/auth/login.html</text>

  <!-- Redirect User -->
  <path d="M 320 559 L 255 559" class="arrow"/>
  <rect x="55" y="538" width="200" height="42" class="act-node"/>
  <text x="155" y="554" class="node-txt">Buka Halaman Login</text>
  <text x="155" y="569" class="node-sub">User siap melakukan autentikasi</text>

  <!-- End Node -->
  <path d="M 155 580 L 155 620" class="arrow"/>
  <circle cx="155" cy="630" r="14" class="stop-outer"/>
  <circle cx="155" cy="630" r="9" class="stop-inner"/>

</svg>
