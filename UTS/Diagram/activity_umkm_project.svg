<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 1020" width="100%" height="100%">
  <defs>
    <style>
      .bg { fill: #f8fafc; }
      .header-box { fill: #78350f; rx: 8; }
      .header-title { font-family: 'Segoe UI', system-ui, sans-serif; font-size: 18px; font-weight: 700; fill: #ffffff; text-anchor: middle; }
      .header-sub { font-family: 'Segoe UI', system-ui, sans-serif; font-size: 12px; fill: #fef3c7; text-anchor: middle; }
      .swimlane { fill: #ffffff; stroke: #cbd5e1; stroke-width: 1.5; }
      .lane-title-umkm { font-family: 'Segoe UI', system-ui, sans-serif; font-size: 13px; font-weight: 700; fill: #92400e; text-anchor: middle; }
      .lane-title-sys { font-family: 'Segoe UI', system-ui, sans-serif; font-size: 13px; font-weight: 700; fill: #065f46; text-anchor: middle; }
      .lane-title-std { font-family: 'Segoe UI', system-ui, sans-serif; font-size: 13px; font-weight: 700; fill: #312e81; text-anchor: middle; }
      .act-node-umkm { fill: #fffbeb; stroke: #f59e0b; stroke-width: 1.5; rx: 8; }
      .act-node-sys { fill: #ecfdf5; stroke: #10b981; stroke-width: 1.5; rx: 8; }
      .act-node-ai { fill: #faf5ff; stroke: #8b5cf6; stroke-width: 1.5; rx: 8; }
      .act-node-std { fill: #eef2ff; stroke: #4f46e5; stroke-width: 1.5; rx: 8; }
      .node-title { font-family: 'Segoe UI', system-ui, sans-serif; font-size: 11px; font-weight: 700; fill: #0f172a; text-anchor: middle; }
      .node-desc { font-family: 'Segoe UI', system-ui, sans-serif; font-size: 9.5px; fill: #475569; text-anchor: middle; }
      .decision { fill: #fef3c7; stroke: #d97706; stroke-width: 1.5; }
      .dec-text { font-family: 'Segoe UI', system-ui, sans-serif; font-size: 10px; font-weight: 600; fill: #92400e; text-anchor: middle; dominant-baseline: middle; }
      .start-node { fill: #10b981; stroke: #047857; stroke-width: 2.5; }
      .stop-outer { fill: none; stroke: #ef4444; stroke-width: 2; }
      .stop-inner { fill: #ef4444; }
      .arrow { stroke: #64748b; stroke-width: 1.5; fill: none; marker-end: url(#arrowhead); }
      .arrow-reject { stroke: #ef4444; stroke-width: 1.5; fill: none; marker-end: url(#arrowhead-red); stroke-dasharray: 4,3; }
      .branch-lbl { font-family: 'Segoe UI', system-ui, sans-serif; font-size: 9.5px; font-weight: 700; fill: #059669; }
      .branch-lbl-red { font-family: 'Segoe UI', system-ui, sans-serif; font-size: 9.5px; font-weight: 700; fill: #dc2626; }
    </style>
    <marker id="arrowhead" markerWidth="7" markerHeight="5" refX="7" refY="2.5" orient="auto">
      <polygon points="0 0, 7 2.5, 0 5" fill="#64748b"/>
    </marker>
    <marker id="arrowhead-red" markerWidth="7" markerHeight="5" refX="7" refY="2.5" orient="auto">
      <polygon points="0 0, 7 2.5, 0 5" fill="#ef4444"/>
    </marker>
  </defs>

  <!-- Background -->
  <rect width="920" height="1020" class="bg"/>

  <!-- Main Banner -->
  <rect x="25" y="15" width="870" height="50" class="header-box"/>
  <text x="460" y="37" class="header-title">Gambar 2.2 Alur Kerja Pelaku UMKM (Activity Diagram)</text>
  <text x="460" y="53" class="header-sub">Platform SkillBridge: Dari Konsultasi Bahasa Sehari-hari, Seleksi Pelamar AI, hingga Evaluasi Proyek</text>

  <!-- Swimlanes -->
  <!-- Lane 1: Pemilik UMKM -->
  <rect x="25" y="75" width="280" height="920" class="swimlane"/>
  <rect x="25" y="75" width="280" height="34" fill="#fef3c7" stroke="#cbd5e1" stroke-width="1.5"/>
  <text x="165" y="97" class="lane-title-umkm">Pemilik UMKM (Mitra Industri)</text>

  <!-- Lane 2: Sistem Platform & AI -->
  <rect x="305" y="75" width="310" height="920" class="swimlane"/>
  <rect x="305" y="75" width="310" height="34" fill="#d1fae5" stroke="#cbd5e1" stroke-width="1.5"/>
  <text x="460" y="97" class="lane-title-sys">Sistem Platform &amp; LLM Assistant</text>

  <!-- Lane 3: Mahasiswa Pelamar -->
  <rect x="615" y="75" width="280" height="920" class="swimlane"/>
  <rect x="615" y="75" width="280" height="34" fill="#e0e7ff" stroke="#cbd5e1" stroke-width="1.5"/>
  <text x="755" y="97" class="lane-title-std">Mahasiswa (Kandidat &amp; Pelaksana)</text>

  <!-- Start Node -->
  <circle cx="165" cy="130" r="10" class="start-node"/>

  <!-- Step 1: UMKM Registrasi & Masukkan Keluhan -->
  <path d="M 165 140 L 165 160" class="arrow"/>
  <rect x="55" y="160" width="220" height="42" class="act-node-umkm"/>
  <text x="165" y="177" class="node-title">1. Registrasi &amp; Masukkan Masalah</text>
  <text x="165" y="192" class="node-desc">Tulis keluhan dalam bahasa sehari-hari</text>

  <!-- System Verifies Identity -->
  <path d="M 275 181 L 340 181" class="arrow"/>
  <rect x="340" y="160" width="240" height="42" class="act-node-sys"/>
  <text x="460" y="177" class="node-title">2. Pemeriksaan &amp; Verifikasi Usaha</text>
  <text x="460" y="192" class="node-desc">Validasi legalitas usaha &amp; data profil</text>

  <!-- Decision: Valid Identitas? -->
  <path d="M 460 202 L 460 225" class="arrow"/>
  <polygon points="460,225 515,250 460,275 405,250" class="decision"/>
  <text x="460" y="253" class="dec-text">Identitas Valid?</text>

  <!-- Reject -> Lengkapi Data -->
  <path d="M 405 250 L 165 250 L 165 202" class="arrow-reject"/>
  <text x="250" y="244" class="branch-lbl-red">[Belum: Lengkapi Data]</text>

  <!-- Approved -> LLM Prompt Processing -->
  <path d="M 460 275 L 460 300" class="arrow"/>
  <text x="468" y="290" class="branch-lbl">[Ya]</text>
  <rect x="340" y="300" width="240" height="42" class="act-node-ai"/>
  <text x="460" y="317" class="node-title">3. LLM Brief &amp; Tag Synthesis</text>
  <text x="460" y="332" class="node-desc">Susun judul, tujuan, deliverables &amp; skill tags</text>

  <!-- UMKM Reviews AI Brief -->
  <path d="M 340 321 L 165 321 L 165 365" class="arrow"/>
  <rect x="55" y="365" width="220" height="42" class="act-node-umkm"/>
  <text x="165" y="382" class="node-title">4. Tinjau Brief Hasil AI</text>
  <text x="165" y="397" class="node-desc">Evaluasi cakupan deliverables &amp; durasi</text>

  <!-- Decision: Sesuai Ekspektasi? -->
  <path d="M 165 407 L 165 430" class="arrow"/>
  <polygon points="165,430 220,455 165,480 110,455" class="decision"/>
  <text x="165" y="458" class="dec-text">Brief Sesuai?</text>

  <!-- Edit Brief if not suitable -->
  <path d="M 110 455 L 65 455 L 65 386 L 55 386" class="arrow-reject"/>
  <text x="35" y="445" class="branch-lbl-red">[Edit]</text>

  <!-- Suitable -> Publish Project to Marketplace -->
  <path d="M 220 455 L 340 455" class="arrow"/>
  <text x="245" y="448" class="branch-lbl">[Sesuai: Publikasikan]</text>
  <rect x="340" y="435" width="240" height="42" class="act-node-sys"/>
  <text x="460" y="452" class="node-title">5. Publikasikan ke Marketplace</text>
  <text x="460" y="467" class="node-desc">Listing aktif dan terbuka untuk pelamar</text>

  <!-- Students Apply -->
  <path d="M 580 455 L 645 455" class="arrow"/>
  <rect x="645" y="435" width="220" height="42" class="act-node-std"/>
  <text x="755" y="452" class="node-title">6. Mahasiswa Mengajukan Lamaran</text>
  <text x="755" y="467" class="node-desc">Submit pitch dan ringkasan profil</text>

  <!-- System Runs AI Matchmaking -->
  <path d="M 755 477 L 755 520 L 580 520" class="arrow"/>
  <rect x="340" y="500" width="240" height="42" class="act-node-ai"/>
  <text x="460" y="517" class="node-title">7. Skor &amp; Rasionalisasi AI</text>
  <text x="460" y="532" class="node-desc">Hitung persentase kecocokan &amp; analisis gap</text>

  <!-- UMKM Reviews Applicants with AI Score -->
  <path d="M 340 521 L 165 521 L 165 565" class="arrow"/>
  <rect x="55" y="565" width="220" height="42" class="act-node-umkm"/>
  <text x="165" y="582" class="node-title">8. Seleksi Pelamar &amp; Rekomendasi</text>
  <text x="165" y="597" class="node-desc">Lihat profil anonim, skor %, &amp; saran aksi</text>

  <!-- Decision: Terima Kandidat? -->
  <path d="M 165 607 L 165 635" class="arrow"/>
  <polygon points="165,635 220,660 165,685 110,660" class="decision"/>
  <text x="165" y="663" class="dec-text">Terima Kandidat?</text>

  <!-- Reject -> Send Notification -->
  <path d="M 110 660 L 65 660 L 65 710 L 340 710" class="arrow-reject"/>
  <text x="40" y="680" class="branch-lbl-red">[Tolak: Notifikasi]</text>
  <rect x="340" y="695" width="240" height="32" class="act-node-sys"/>
  <text x="460" y="715" class="node-title">Kirim Notifikasi Status Penolakan</text>

  <!-- Accept -> Automated Workspace Creation -->
  <path d="M 220 660 L 460 660 L 460 670" class="arrow"/>
  <text x="250" y="652" class="branch-lbl">[Terima]</text>
  <rect x="340" y="650" width="240" height="38" class="act-node-sys"/>
  <text x="460" y="666" class="node-title">9. Buat Workspace &amp; Buka Kontak</text>
  <text x="460" y="679" class="node-desc">Double Opt-In membuka identitas resmi</text>

  <!-- Collaborative Monitoring -->
  <path d="M 340 669 L 165 669 L 165 745" class="arrow"/>
  <rect x="55" y="745" width="220" height="42" class="act-node-umkm"/>
  <text x="165" y="762" class="node-title">10. Pantau Milestone &amp; Chat</text>
  <text x="165" y="777" class="node-desc">Koordinasi berkala &amp; cek task checklist</text>

  <!-- Student works and submits -->
  <path d="M 580 669 L 755 669 L 755 745" class="arrow"/>
  <rect x="645" y="745" width="220" height="42" class="act-node-std"/>
  <text x="755" y="762" class="node-title">11. Mahasiswa Serahkan Deliverable</text>
  <text x="755" y="777" class="node-desc">Unggah link final produk digital</text>

  <!-- UMKM Evaluates Deliverable -->
  <path d="M 645 766 L 275 766" class="arrow"/>
  <path d="M 165 787 L 165 815" class="arrow"/>
  <polygon points="165,815 220,840 165,865 110,840" class="decision"/>
  <text x="165" y="843" class="dec-text">Hasil Disetujui?</text>

  <!-- Needs Revision -->
  <path d="M 110 840 L 65 840 L 65 800 L 55 800" class="arrow-reject"/>
  <text x="40" y="830" class="branch-lbl-red">[Revisi]</text>

  <!-- Approved -> Complete & Rate -->
  <path d="M 220 840 L 340 840" class="arrow"/>
  <text x="245" y="833" class="branch-lbl">[Setuju: Proyek Selesai]</text>
  <rect x="340" y="820" width="240" height="42" class="act-node-sys"/>
  <text x="460" y="837" class="node-title">12. Selesaikan Proyek &amp; Feedback</text>
  <text x="460" y="852" class="node-desc">Update riwayat kolaborasi &amp; rating model</text>

  <!-- UMKM Gives Rating -->
  <path d="M 340 841 L 165 841 L 165 895" class="arrow"/>
  <rect x="55" y="895" width="220" height="40" class="act-node-umkm"/>
  <text x="165" y="912" class="node-title">13. UMKM Beri Rating &amp; Review</text>
  <text x="165" y="926" class="node-desc">Beri testimoni resmi hasil pendampingan</text>

  <!-- Student also leaves review -->
  <path d="M 580 841 L 755 841 L 755 895" class="arrow"/>
  <rect x="645" y="895" width="220" height="40" class="act-node-std"/>
  <text x="755" y="912" class="node-title">14. Mahasiswa Beri Review UMKM</text>
  <text x="755" y="926" class="node-desc">Ulasan pengalaman kemitraan industri</text>

  <!-- End Node -->
  <path d="M 165 935 L 165 965 L 435 965" class="arrow"/>
  <path d="M 755 935 L 755 965 L 485 965" class="arrow"/>
  <circle cx="460" cy="965" r="14" class="stop-outer"/>
  <circle cx="460" cy="965" r="9" class="stop-inner"/>

</svg>
