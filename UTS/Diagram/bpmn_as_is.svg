<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 620" width="100%" height="100%">
  <defs>
    <style>
      .bg { fill: #f8fafc; }
      .header-box { fill: #991b1b; rx: 8; }
      .header-title { font-family: 'Segoe UI', system-ui, sans-serif; font-size: 17px; font-weight: 700; fill: #ffffff; text-anchor: middle; }
      .header-sub { font-family: 'Segoe UI', system-ui, sans-serif; font-size: 11px; fill: #fecaca; text-anchor: middle; }
      .swimlane { fill: #ffffff; stroke: #cbd5e1; stroke-width: 1.5; }
      .lane-title { font-family: 'Segoe UI', system-ui, sans-serif; font-size: 13px; font-weight: 700; text-anchor: middle; }
      .task-box { fill: #ffffff; stroke: #b91c1c; stroke-width: 1.5; rx: 8; }
      .task-title { font-family: 'Segoe UI', system-ui, sans-serif; font-size: 10.5px; font-weight: 700; fill: #0f172a; text-anchor: middle; }
      .task-io { font-family: 'Segoe UI', system-ui, sans-serif; font-size: 8.5px; fill: #64748b; text-anchor: middle; }
      .gateway { fill: #fef3c7; stroke: #d97706; stroke-width: 1.5; }
      .gw-txt { font-family: 'Segoe UI', system-ui, sans-serif; font-size: 10px; font-weight: 700; fill: #92400e; text-anchor: middle; dominant-baseline: middle; }
      .start-node { fill: #10b981; stroke: #047857; stroke-width: 2.5; }
      .stop-outer { fill: none; stroke: #ef4444; stroke-width: 2; }
      .stop-inner { fill: #ef4444; }
      .arrow { stroke: #64748b; stroke-width: 1.5; fill: none; marker-end: url(#arrowhead); }
      .arrow-reject { stroke: #ef4444; stroke-width: 1.5; fill: none; stroke-dasharray: 4,3; marker-end: url(#arrowhead-red); }
      .lbl-yes { font-family: 'Segoe UI', system-ui, sans-serif; font-size: 9.5px; font-weight: 700; fill: #059669; }
      .lbl-no { font-family: 'Segoe UI', system-ui, sans-serif; font-size: 9.5px; font-weight: 700; fill: #dc2626; }
    </style>
    <marker id="arrowhead" markerWidth="7" markerHeight="5" refX="7" refY="2.5" orient="auto">
      <polygon points="0 0, 7 2.5, 0 5" fill="#64748b"/>
    </marker>
    <marker id="arrowhead-red" markerWidth="7" markerHeight="5" refX="7" refY="2.5" orient="auto">
      <polygon points="0 0, 7 2.5, 0 5" fill="#ef4444"/>
    </marker>
  </defs>

  <rect width="920" height="620" class="bg"/>

  <!-- Header -->
  <rect x="25" y="15" width="870" height="48" class="header-box"/>
  <text x="460" y="36" class="header-title">BPMN AS-IS: Proses Bisnis Konvensional Kolaborasi UMKM &amp; Mahasiswa</text>
  <text x="460" y="52" class="header-sub">Identifikasi Hambatan (Bottlenecks): Format Tidak Terstruktur, Seleksi Bias, &amp; Ketiadaan Portofolio Terverifikasi</text>

  <!-- Swimlane 1: UMKM -->
  <rect x="25" y="70" width="870" height="250" class="swimlane"/>
  <rect x="25" y="70" width="40" height="250" fill="#fee2e2" stroke="#cbd5e1" stroke-width="1.5"/>
  <text x="-195" y="45" transform="rotate(-90)" fill="#991b1b" class="lane-title">Pelaku Usaha Mikro (UMKM)</text>

  <!-- Swimlane 2: Mahasiswa -->
  <rect x="25" y="320" width="870" height="265" class="swimlane"/>
  <rect x="25" y="320" width="40" height="265" fill="#e0e7ff" stroke="#cbd5e1" stroke-width="1.5"/>
  <text x="-452" y="45" transform="rotate(-90)" fill="#312e81" class="lane-title">Mahasiswa (Pencari Proyek)</text>

  <!-- Start Event -->
  <circle cx="95" cy="180" r="12" class="start-node"/>

  <!-- Task 1: Post medsos -->
  <path d="M 107 180 L 130 180" class="arrow"/>
  <rect x="130" y="152" width="145" height="56" class="task-box"/>
  <text x="202" y="172" class="task-title">Posting Lowongan Medsos</text>
  <text x="202" y="188" class="task-io">[In: Masalah Usaha Sepi]</text>
  <text x="202" y="200" class="task-io">[Out: Postingan WhatsApp/IG]</text>

  <!-- Flow to Student -->
  <path d="M 202 208 L 202 410" class="arrow"/>

  <!-- Task 2: Student applies via WA -->
  <rect x="130" y="410" width="145" height="56" class="task-box"/>
  <text x="202" y="430" class="task-title">Kirim CV Mentah via Chat</text>
  <text x="202" y="446" class="task-io">[In: Pesan Informasi Medsos]</text>
  <text x="202" y="458" class="task-io">[Out: Dokumen PDF CV Mentah]</text>

  <!-- Flow back to UMKM -->
  <path d="M 275 438 L 320 438 L 320 180 L 340 180" class="arrow"/>

  <!-- Task 3: UMKM manual review -->
  <rect x="340" y="152" width="145" height="56" class="task-box"/>
  <text x="412" y="172" class="task-title">Tinjau CV Secara Manual</text>
  <text x="412" y="188" class="task-io">[In: Berkas PDF Pelamar]</text>
  <text x="412" y="200" class="task-io">[Out: Keputusan Subjektif]</text>

  <!-- Gateway 1: Cocok? -->
  <path d="M 485 180 L 515 180" class="arrow"/>
  <polygon points="535,160 555,180 535,200 515,180" class="gateway"/>
  <text x="535" y="180" class="gw-txt">X</text>

  <!-- Reject -> Stop -->
  <path d="M 535 160 L 535 115 L 610 115" class="arrow-reject"/>
  <text x="545" y="130" class="lbl-no">[Tidak Cocok]</text>
  <circle cx="625" cy="115" r="12" class="stop-outer"/>
  <circle cx="625" cy="115" r="7" class="stop-inner"/>

  <!-- Accept -> Negosiasi Informal -->
  <path d="M 555 180 L 595 180" class="arrow"/>
  <text x="560" y="172" class="lbl-yes">[Cocok]</text>
  <rect x="595" y="152" width="145" height="56" class="task-box"/>
  <text x="667" y="172" class="task-title">Negosiasi Tanpa Kontrak</text>
  <text x="667" y="188" class="task-io">[In: Kesepakatan Lisan]</text>
  <text x="667" y="200" class="task-io">[Out: Komitmen Tidak Baku]</text>

  <!-- Pengerjaan tanpa tracking -->
  <path d="M 667 208 L 667 410" class="arrow"/>
  <rect x="595" y="410" width="145" height="56" class="task-box"/>
  <text x="667" y="430" class="task-title">Eksekusi Tanpa Tracking</text>
  <text x="667" y="446" class="task-io">[In: Arahan Chat Sporadis]</text>
  <text x="667" y="458" class="task-io">[Out: Draf Hasil Pekerjaan]</text>

  <!-- Serahkan via WA -> UMKM Review -->
  <path d="M 740 438 L 780 438 L 780 180 L 800 180" class="arrow"/>
  <rect x="760" y="152" width="115" height="56" class="task-box"/>
  <text x="817" y="172" class="task-title">Evaluasi Hasil</text>
  <text x="817" y="188" class="task-io">[In: Berkas Chat]</text>
  <text x="817" y="200" class="task-io">[Out: Komplain/OK]</text>

  <!-- Selesai tanpa portofolio resmi -->
  <path d="M 817 208 L 817 500" class="arrow"/>
  <rect x="745" y="500" width="145" height="50" class="task-box"/>
  <text x="817" y="520" class="task-title">Selesai Tanpa Bukti</text>
  <text x="817" y="534" class="task-io">Tidak Ada Rekam Jejak Industri</text>

  <!-- End Node -->
  <circle cx="817" cy="575" r="12" class="stop-outer"/>
  <circle cx="817" cy="575" r="7" class="stop-inner"/>
  <path d="M 817 550 L 817 563" class="arrow"/>

</svg>
