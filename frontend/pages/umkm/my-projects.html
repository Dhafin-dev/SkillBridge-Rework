
<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>My Projects — SkillBridge</title>

  <link rel="stylesheet" href="../../assets/css/style.css">
  <link rel="stylesheet" href="../../assets/css/components.css">

  <style>
    .sb-project-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 20px;
      flex-wrap: wrap;
      margin-bottom: 30px;
    }

    .sb-project-header h1 {
      font-size: clamp(26px, 3vw, 36px);
      font-weight: 800;
      color: #0f172a;
      margin: 0 0 6px;
    }

    .sb-project-header p {
      color: #64748b;
      font-size: 14px;
      margin: 0;
      line-height: 1.6;
    }

    .sb-project-tabs {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      margin-bottom: 24px;
      border-bottom: 1px solid #e2e8f0;
      padding-bottom: 14px;
    }

    .sb-tab {
      display: inline-flex;
      align-items: center;
      gap: 9px;
      background: transparent;
      color: #64748b;
      border: 0;
      border-radius: 10px;
      padding: 10px 13px;
      font-size: 13px;
      font-weight: 700;
      cursor: pointer;
    }

    .sb-tab:hover {
      background: #f1f5f9;
    }

    .sb-tab.active {
      color: #2563eb;
      background: #eff6ff;
    }

    .sb-tab-count {
      padding: 3px 8px;
      background: #e2e8f0;
      color: #475569;
      border-radius: 999px;
      font-size: 11px;
      font-weight: 800;
    }

    .sb-tab.active .sb-tab-count {
      background: #2563eb;
      color: #fff;
    }

    .sb-project-card {
      background: #fff;
      border: 1px solid #e2e8f0;
      border-radius: 20px;
      padding: 25px;
      margin-bottom: 17px;
      box-shadow: 0 2px 8px rgba(15,23,42,0.025);
    }

    .sb-project-card-top,
    .sb-project-card-bottom {
      display: flex;
      align-items: center;
      justify-content: space-between;
      flex-wrap: wrap;
      gap: 12px;
    }

    .sb-project-card-top {
      margin-bottom: 14px;
    }

    .sb-badges {
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
    }

    .sb-badge {
      display: inline-block;
      padding: 6px 11px;
      border-radius: 999px;
      font-size: 11px;
      font-weight: 800;
    }

    .sb-badge.recruiting {
      color: #2563eb;
      background: #dbeafe;
    }

    .sb-badge.draft {
      color: #475569;
      background: #f1f5f9;
    }

    .sb-badge.active {
      color: #7c3aed;
      background: #f3e8ff;
    }

    .sb-badge.completed {
      color: #15803d;
      background: #dcfce7;
    }

    .sb-badge.archived {
      color: #64748b;
      background: #f1f5f9;
    }

    .sb-badge.category {
      color: #475569;
      background: #f8fafc;
      border: 1px solid #e2e8f0;
    }

    .sb-project-card h2 {
      font-size: 20px;
      color: #0f172a;
      margin: 0 0 11px;
      font-weight: 800;
      overflow-wrap: anywhere;
    }

    .sb-project-desc {
      font-size: 13px;
      color: #64748b;
      line-height: 1.7;
      margin: 0 0 16px;
      white-space: pre-line;
    }

    .sb-project-meta {
      display: flex;
      gap: 18px;
      flex-wrap: wrap;
      color: #64748b;
      font-size: 12px;
      margin-bottom: 20px;
    }

    .sb-project-meta strong {
      color: #334155;
    }

    .sb-skills {
      display: flex;
      flex-wrap: wrap;
      gap: 7px;
      margin-bottom: 20px;
    }

    .sb-skill {
      padding: 5px 10px;
      border-radius: 7px;
      color: #475569;
      background: #f1f5f9;
      font-size: 11px;
      font-weight: 600;
    }

    .sb-project-card-bottom {
      border-top: 1px solid #edf2f7;
      padding-top: 17px;
    }

    .sb-project-date {
      font-size: 12px;
      color: #94a3b8;
    }

    .sb-project-actions {
      display: flex;
      align-items: center;
      flex-wrap: wrap;
      gap: 15px;
    }

    .sb-action-link {
      font-size: 12px;
      color: #2563eb;
      font-weight: 800;
      text-decoration: none;
    }

    .sb-action-link:hover {
      text-decoration: underline;
    }

    .sb-delete-btn {
      border: 0;
      background: transparent;
      color: #dc2626;
      cursor: pointer;
      font-size: 12px;
      font-weight: 700;
      padding: 5px;
    }

    .sb-state {
      background: white;
      border: 1px solid #e2e8f0;
      border-radius: 20px;
      padding: 55px 20px;
      text-align: center;
    }

    .sb-state h3 {
      color: #0f172a;
      margin: 10px 0;
    }

    .sb-state p {
      color: #64748b;
      font-size: 13px;
      line-height: 1.7;
      margin-bottom: 20px;
    }

    .sb-error {
      background: #fef2f2;
      color: #b91c1c;
      border: 1px solid #fecaca;
      border-radius: 12px;
      padding: 15px;
      margin-bottom: 20px;
      font-size: 13px;
      white-space: pre-wrap;
    }

    @media (max-width: 650px) {
      .sb-project-card {
        padding: 19px;
      }

      .sb-project-tabs {
        flex-wrap: nowrap;
        overflow-x: auto;
      }

      .sb-tab {
        white-space: nowrap;
      }

      .sb-project-actions {
        width: 100%;
      }
    }
  </style>
</head>

<body class="dashboard-body">

  <div class="dashboard-layout">

    <!-- SIDEBAR -->
    <aside class="dashboard-sidebar" id="shared-sidebar"></aside>

    <!-- MAIN -->
    <main class="dashboard-main">

      <header class="dashboard-topbar" id="shared-topbar"></header>

      <div class="dashboard-canvas">

        <div class="sb-project-header">
          <div>
            <h1>My Projects</h1>
            <p>
              Manage draft briefs, published recruitment,
              and active collaborative workspaces.
            </p>
          </div>

          <a
            href="create-project.html"
            class="btn btn-primary"
            style="border-radius:999px;padding:12px 22px;"
          >
            + New Project
          </a>
        </div>

        <!-- FILTER TABS -->
        <div class="sb-project-tabs">

          <button class="sb-tab active"
            type="button"
            data-filter="all">
            All Projects
            <span class="sb-tab-count" id="count-all">0</span>
          </button>

          <button class="sb-tab"
            type="button"
            data-filter="draft">
            Drafts
            <span class="sb-tab-count" id="count-draft">0</span>
          </button>

          <button class="sb-tab"
            type="button"
            data-filter="recruiting">
            Recruiting
            <span class="sb-tab-count" id="count-recruiting">0</span>
          </button>

          <button class="sb-tab"
            type="button"
            data-filter="active">
            Active
            <span class="sb-tab-count" id="count-active">0</span>
          </button>

          <button class="sb-tab"
            type="button"
            data-filter="completed">
            Completed
            <span class="sb-tab-count" id="count-completed">0</span>
          </button>

        </div>

        <div id="projects-error" hidden></div>

        <div id="umkm-projects-list">
          <div class="sb-state">
            <h3>Loading projects...</h3>
            <p>Mengambil proyek dari Supabase.</p>
          </div>
        </div>

      </div>
    </main>
  </div>

  <!-- DEPENDENCIES -->
  <script src="../../assets/vendor/supabase.js"></script>
  <script src="../../assets/js/config.js"></script>
  <script src="../../assets/js/supabase.js"></script>
  <script src="../../assets/js/toast.js"></script>
  <script src="../../assets/js/auth.js"></script>
  <script src="../../assets/js/database.js"></script>
  <script src="../../assets/js/settings.js"></script>

    <script src="../../assets/js/layout.js"></script>
<script>
    "use strict";

    const db = window.supabaseClient;

    const projectList = document.getElementById(
      "umkm-projects-list"
    );

    const errorBox = document.getElementById(
      "projects-error"
    );

    const searchInput = document.getElementById(
      "project-search-topbar"
    );

    let myProjects = [];
    let applicantCounts = {};
    let currentFilter = "all";

    // ==================================
    // HTML ESCAPING
    // ==================================

    function esc(value) {
      return String(value ?? "")
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;")
        .replace(/'/g, "&#39;");
    }

    function showError(message) {
      errorBox.hidden = false;
      errorBox.className = "sb-error";
      errorBox.textContent = message;
    }

    function clearError() {
      errorBox.hidden = true;
      errorBox.textContent = "";
    }

    function formatMoney(value) {
      return "Rp " + Number(value || 0)
        .toLocaleString("id-ID");
    }

    function formatDate(value) {
      if (!value) return "-";

      const date = new Date(value);

      return Number.isNaN(date.getTime())
        ? "-"
        : date.toLocaleDateString("id-ID", {
            day: "numeric",
            month: "short",
            year: "numeric"
          });
    }

    // ==================================
    // LOAD REAL PROJECTS
    // ==================================

    async function loadMyProjects() {
      clearError();

      projectList.innerHTML = `
        <div class="sb-state">
          <h3>Loading projects...</h3>
          <p>Mengambil data terbaru dari Supabase.</p>
        </div>
      `;

      try {
        if (!db) {
          throw new Error(
            "Supabase client belum terhubung."
          );
        }

        await window.SkillBridgeAuth.ready();

        const user =
          await window.SkillBridgeAuth.requireAuth("umkm");

        if (!user?.id) return;

        const avatar = document.getElementById(
          "umkm-avatar-circle"
        );

        if (avatar) {
          const name =
            user.company_name ||
            user.name ||
            "UMKM";

          avatar.textContent =
            name.charAt(0).toUpperCase();
        }

        // Ambil proyek milik akun login SAJA.
        // Tidak ada fallback ke semua proyek.
        const { data: projects, error: projectError } =
          await db
            .from("projects")
            .select("*")
            .eq("owner_id", user.id)
            .order("created_at", {
              ascending: false
            });

        if (projectError) throw projectError;

        myProjects = projects || [];

        // Ambil nama kategori dari tabel asli.
        const categoryIds = [
          ...new Set(
            myProjects
              .map(p => p.category_id)
              .filter(Boolean)
          )
        ];

        const categoriesById = {};

        if (categoryIds.length > 0) {
          const { data: categories, error: categoryError } =
            await db
              .from("categories")
              .select("id,name")
              .in("id", categoryIds);

          if (categoryError) {
            console.warn(
              "Gagal membaca kategori:",
              categoryError
            );
          } else {
            (categories || []).forEach(category => {
              categoriesById[category.id] =
                category.name;
            });
          }
        }

        myProjects = myProjects.map(project => ({
          ...project,
          category_name:
            categoriesById[project.category_id] ||
            "Uncategorized"
        }));

        // Hitung jumlah lamaran yang memang
        // terlihat oleh akun UMKM sesuai RLS.
        applicantCounts = {};

        const projectIds = myProjects.map(p => p.id);

        if (projectIds.length > 0) {
          const { data: applications, error: appError } =
            await db
              .from("project_applications")
              .select("id,project_id")
              .in("project_id", projectIds);

          if (appError) {
            console.warn(
              "Gagal membaca jumlah pelamar:",
              appError
            );
          } else {
            (applications || []).forEach(application => {
              applicantCounts[application.project_id] =
                (applicantCounts[application.project_id] || 0) + 1;
            });
          }
        }

        renderProjects();

      } catch (error) {
        console.error(
          "[SkillBridge My Projects]",
          error
        );

        showError(
          "Gagal memuat proyek: " +
          (error.message || "Unknown error")
        );

        projectList.innerHTML = "";
      }
    }

    // ==================================
    // UPDATE COUNTS
    // ==================================

    function updateTabCounts() {
      const counts = {
        all: myProjects.length,
        draft: 0,
        recruiting: 0,
        active: 0,
        completed: 0
      };

      myProjects.forEach(project => {
        if (counts[project.status] !== undefined) {
          counts[project.status]++;
        }
      });

      Object.entries(counts).forEach(([key, value]) => {
        const el = document.getElementById(
          "count-" + key
        );

        if (el) {
          el.textContent = value;
        }
      });
    }

    // ==================================
    // RENDER PROJECTS
    // ==================================

    function renderProjects() {
      updateTabCounts();

      const search = searchInput.value
        .trim()
        .toLowerCase();

      const filtered = myProjects.filter(project => {
        const matchesStatus =
          currentFilter === "all" ||
          project.status === currentFilter;

        const matchesSearch =
          String(project.title || "")
            .toLowerCase()
            .includes(search) ||
          String(project.description || "")
            .toLowerCase()
            .includes(search);

        return matchesStatus && matchesSearch;
      });

      if (filtered.length === 0) {
        const isEmptyAccount = myProjects.length === 0;

        projectList.innerHTML = `
          <div class="sb-state">
            <div style="font-size:35px;">📂</div>
            <h3>
              ${isEmptyAccount
                ? "Belum ada proyek"
                : "Tidak ada proyek yang cocok"}
            </h3>
            <p>
              ${isEmptyAccount
                ? "Buat proyek pertamamu untuk mulai mencari mahasiswa."
                : "Coba ubah filter atau kata pencarian."}
            </p>

            ${isEmptyAccount ? `
              <a href="create-project.html"
                 class="btn btn-primary"
                 style="border-radius:999px;">
                + Buat Proyek Baru
              </a>
            ` : ""}
          </div>
        `;

        return;
      }

      projectList.innerHTML = filtered.map(project => {
        const id = encodeURIComponent(project.id);

        const status = String(
          project.status || "draft"
        ).toLowerCase();

        const validStatuses = [
          "draft",
          "recruiting",
          "active",
          "completed",
          "archived"
        ];

        const safeStatus =
          validStatuses.includes(status)
            ? status
            : "draft";

        const statusLabels = {
          draft: "DRAFT",
          recruiting: "OPEN FOR TALENTS",
          active: "ACTIVE",
          completed: "COMPLETED",
          archived: "ARCHIVED"
        };

        const applicantCount =
          applicantCounts[project.id] || 0;

        const skills = Array.isArray(
          project.required_skills
        ) ? project.required_skills : [];

        const skillsHTML = skills.map(skill => `
          <span class="sb-skill">
            ${esc(skill)}
          </span>
        `).join("");

        const shortDescription = String(
          project.description || ""
        ).slice(0, 220);

        return `
          <article class="sb-project-card">

            <div class="sb-project-card-top">
              <div class="sb-badges">
                <span class="sb-badge ${safeStatus}">
                  ${statusLabels[safeStatus]}
                </span>

                <span class="sb-badge category">
                  ${esc(project.category_name)}
                </span>
              </div>
            </div>

            <h2>${esc(project.title)}</h2>

            <p class="sb-project-desc">
              ${esc(shortDescription)}
              ${String(project.description || "").length > 220 ? "..." : ""}
            </p>

            <div class="sb-project-meta">
              <span>
                <strong>Budget:</strong>
                ${formatMoney(project.budget)}
              </span>

              <span>
                <strong>Location:</strong>
                ${esc(project.location || "-")}
              </span>

              <span>
                <strong>Applicants:</strong>
                ${applicantCount}
              </span>

              <span>
                <strong>Deadline:</strong>
                ${formatDate(project.deadline)}
              </span>
            </div>

            ${skillsHTML ? `
              <div class="sb-skills">
                ${skillsHTML}
              </div>
            ` : ""}

            <div class="sb-project-card-bottom">

              <span class="sb-project-date">
                Created: ${formatDate(project.created_at)}
              </span>

              <div class="sb-project-actions">

                <a
                  href="../project-detail.html?id=${id}"
                  class="sb-action-link"
                >
                  View Project
                </a>

                <a
                  href="applicants.html?project_id=${id}"
                  class="sb-action-link"
                >
                  Kelola Pelamar (${applicantCount})
                </a>

                <button
                  type="button"
                  class="sb-delete-btn"
                  data-delete-id="${esc(project.id)}"
                >
                  Hapus
                </button>

              </div>
            </div>

          </article>
        `;
      }).join("");
    }

    // ==================================
    // DELETE PROJECT
    // ==================================

    async function deleteProject(projectId) {
      const project = myProjects.find(
        p => p.id === projectId
      );

      if (!project) return;

      const confirmed = confirm(
        `Yakin ingin menghapus proyek "${project.title}"?\n\n` +
        "Data lamaran terkait juga dapat terhapus."
      );

      if (!confirmed) return;

      try {
        const user =
          await window.SkillBridgeAuth.requireAuth("umkm");

        if (!user?.id) return;

        const { data, error } = await db
          .from("projects")
          .delete()
          .eq("id", projectId)
          .eq("owner_id", user.id)
          .select("id");

        if (error) throw error;

        if (!data || data.length === 0) {
          throw new Error(
            "Proyek tidak terhapus. Periksa hak akses akun."
          );
        }

        if (window.toast?.success) {
          window.toast.success(
            "Proyek berhasil dihapus."
          );
        }

        await loadMyProjects();

      } catch (error) {
        console.error(
          "Delete project error:",
          error
        );

        if (window.toast?.error) {
          window.toast.error(error.message);
        } else {
          alert(error.message);
        }
      }
    }

    // ==================================
    // EVENTS
    // ==================================

    document.querySelectorAll(".sb-tab").forEach(button => {
      button.addEventListener("click", () => {
        currentFilter = button.dataset.filter;

        document.querySelectorAll(".sb-tab")
          .forEach(tab => tab.classList.remove("active"));

        button.classList.add("active");

        renderProjects();
      });
    });

    searchInput.addEventListener(
      "input",
      renderProjects
    );

    projectList.addEventListener(
      "click",
      async event => {
        const button = event.target.closest(
          "[data-delete-id]"
        );

        if (!button) return;

        await deleteProject(
          button.dataset.deleteId
        );
      }
    );

    document.addEventListener(
      "DOMContentLoaded",
      loadMyProjects
    );

  </script>
</body>
</html>
