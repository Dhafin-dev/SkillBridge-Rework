<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 850 720" width="100%" height="100%">
  <defs>
    <style>
      .bg { fill: #f8fafc; }
      .header-box { fill: #1e1b4b; rx: 8; }
      .header-title { font-family: 'Segoe UI', system-ui, sans-serif; font-size: 17px; font-weight: 700; fill: #ffffff; text-anchor: middle; }
      .header-sub { font-family: 'Segoe UI', system-ui, sans-serif; font-size: 11px; fill: #c7d2fe; text-anchor: middle; }
      .swimlane { fill: #ffffff; stroke: #cbd5e1; stroke-width: 1.5; }
      .lane-title { font-family: 'Segoe UI', system-ui, sans-serif; font-size: 13px; font-weight: 700; text-anchor: middle; }
      .act-node { fill: #ffffff; stroke: #4f46e5; stroke-width: 1.5; rx: 8; }
      .act-node-sys { fill: #ecfdf5; stroke: #10b981; stroke-width: 1.5; rx: 8; }
      .act-node-db { fill: #f1f5f9; stroke: #64748b; stroke-width: 1.5; rx: 8; }
      .node-txt { font-family: 'Segoe UI', system-ui, sans-serif; font-size: 11px; font-weight: 600; fill: #0f172a; text-anchor: middle; dominant-baseline: middle; }
      .node-sub { font-family: 'Segoe UI', system-ui, sans-serif; font-size: 9.5px; fill: #475569; text-anchor: middle; }
      .decision { fill: #fef3c7; stroke: #d97706; stroke-width: 1.5; }
      .dec-txt { font-family: 'Segoe UI', system-ui, sans-serif; font-size: 10px; font-weight: 600; fill: #92400e; text-anchor: middle; dominant-baseline: middle; }
      .start-node { fill: #10b981; stroke: #047857; stroke-width: 2.5; }
      .stop-outer { fill: none; stroke: #ef4444; stroke-width: 2; }
      .stop-inner { fill: #ef4444; }
      .arrow { stroke: #64748b; stroke-width: 1.5; fill: none; marker-end: url(#arrowhead); }
      .arrow-err { stroke: #ef4444; stroke-width: 1.5; fill: none; stroke-dasharray: 4,3; marker-end: url(#arrowhead-red); }
      .branch-lbl { font-family: 'Segoe UI', system-ui, sans-serif; font-size: 9.5px; font-weight: 700; fill: #059669; }
      .branch-lbl-red { font-family: 'Segoe UI', system-ui, sans-serif; font-size: 9.5px; font-weight: 700; fill: #dc2626; }
    </style>
    <marker id="arrowhead" markerWidth="7" markerHeight="5" refX="7" refY="2.5" orient="auto">
      <polygon points="0 0, 7 2.5, 0 5" fill="#64748b"/>
    </marker>
    <marker id="arrowhead-red" markerWidth="7" markerHeight="5" refX="7" refY="2.5" orient="auto">
      <polygon points="0 0, 7 2.5, 0 5" fill="#ef4444"/>
    </marker>
  </defs>

  <rect width="850" height="720" class="bg"/>

  <!-- Header Banner -->
  <rect x="25" y="15" width="800" height="48" class="header-box"/>
  <text x="425" y="36" class="header-title">Activity Diagram: Autentikasi Pengguna &amp; Perutean Multi-Peran</text>
  <text x="425" y="52" class="header-sub">Platform SkillBridge: Login Terpadu JWT, Verifikasi Hash, &amp; Redirection Dashboard</text>

  <!-- Swimlanes -->
  <!-- Lane 1: Pengguna -->
  <rect x="25" y="70" width="260" height="625" class="swimlane"/>
  <rect x="25" y="70" width="260" height="32" fill="#e0e7ff" stroke="#cbd5e1" stroke-width="1.5"/>
  <text x="155" y="91" fill="#312e81" class="lane-title">Pengguna (Mahasiswa/UMKM/Admin)</text>

  <!-- Lane 2: Auth Controller & Supabase -->
  <rect x="285" y="70" width="275" height="625" class="swimlane"/>
  <rect x="285" y="70" width="275" height="32" fill="#d1fae5" stroke="#cbd5e1" stroke-width="1.5"/>
  <text x="422" y="91" fill="#065f46" class="lane-title">Auth Controller &amp; GoTrue Engine</text>

  <!-- Lane 3: Database PostgreSQL -->
  <rect x="560" y="70" width="265" height="625" class="swimlane"/>
  <rect x="560" y="70" width="265" height="32" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="1.5"/>
  <text x="692" y="91" fill="#334155" class="lane-title">Database (PostgreSQL 15+)</text>

  <!-- Start Node -->
  <circle cx="155" cy="125" r="10" class="start-node"/>

  <!-- Step 1: Open Login Page -->
  <path d="M 155 135 L 155 155" class="arrow"/>
  <rect x="55" y="155" width="200" height="38" class="act-node"/>
  <text x="155" y="174" class="node-txt">Buka Halaman Login</text>

  <!-- Step 2: Input Email & Password -->
  <path d="M 155 193 L 155 215" class="arrow"/>
  <rect x="55" y="215" width="200" height="42" class="act-node"/>
  <text x="155" y="231" class="node-txt">Masukkan Email &amp; Password</text>
  <text x="155" y="246" class="node-sub">Klik tombol "Masuk"</text>

  <!-- Step 3: Call signInWithPassword -->
  <path d="M 255 236 L 320 236" class="arrow"/>
  <rect x="320" y="215" width="205" height="42" class="act-node-sys"/>
  <text x="422" y="231" class="node-txt">supabase.auth.signInWithPassword()</text>
  <text x="422" y="246" class="node-sub">Verifikasi hash kredensial</text>

  <!-- GoTrue verifies bcrypt hash -->
  <path d="M 525 236 L 595 236" class="arrow"/>
  <rect x="595" y="215" width="195" height="42" class="act-node-db"/>
  <text x="692" y="231" class="node-txt">Cek Kredensial auth.users</text>
  <text x="692" y="246" class="node-sub">Bcrypt hash comparison</text>

  <!-- Decision: Kredensial Valid? -->
  <path d="M 692 257 L 692 280" class="arrow"/>
  <polygon points="692,280 742,302 692,324 642,302" class="decision"/>
  <text x="692" y="305" class="dec-txt">Kredensial Valid?</text>

  <!-- Invalid -> Return Error 400 -->
  <path d="M 642 302 L 422 302 L 422 335" class="arrow-err"/>
  <text x="505" y="295" class="branch-lbl-red">[Salah: Error 400]</text>
  <rect x="320" y="335" width="205" height="38" class="act-node-sys"/>
  <text x="422" y="354" class="node-txt">Tampilkan Toast Error Kredensial</text>
  <path d="M 320 354 L 155 354 L 155 257" class="arrow-err"/>

  <!-- Valid -> Issue JWT & Read Role -->
  <path d="M 692 324 L 692 370" class="arrow"/>
  <text x="700" y="345" class="branch-lbl">[Ya: 200 OK]</text>
  <rect x="595" y="370" width="195" height="44" class="act-node-db"/>
  <text x="692" y="386" class="node-txt">SELECT role FROM public.users</text>
  <text x="692" y="401" class="node-sub">Ambil status peran pengguna</text>

  <!-- Return Session & Store in LocalStorage -->
  <path d="M 595 392 L 525 392" class="arrow"/>
  <rect x="320" y="370" width="205" height="44" class="act-node-sys"/>
  <text x="422" y="386" class="node-txt">Simpan Sesi &amp; JWT</text>
  <text x="422" y="401" class="node-sub">Set localStorage (Token &amp; Role)</text>

  <!-- Decision: Multi-Role Routing -->
  <path d="M 422 414 L 422 445" class="arrow"/>
  <polygon points="422,445 472,467 422,489 372,467" class="decision"/>
  <text x="422" y="470" class="dec-txt">Periksa Role?</text>

  <!-- Student Route -->
  <path d="M 372 467 L 255 467" class="arrow"/>
  <text x="270" y="460" class="branch-lbl">[STUDENT]</text>
  <rect x="55" y="445" width="200" height="44" class="act-node"/>
  <text x="155" y="461" class="node-txt">Dashboard Mahasiswa</text>
  <text x="155" y="476" class="node-sub">/pages/student/dashboard.html</text>

  <!-- UMKM Route -->
  <path d="M 422 489 L 422 525 L 255 525" class="arrow"/>
  <text x="270" y="518" class="branch-lbl">[UMKM]</text>
  <rect x="55" y="505" width="200" height="44" class="act-node"/>
  <text x="155" y="521" class="node-txt">Dashboard Pemilik UMKM</text>
  <text x="155" y="536" class="node-sub">/pages/umkm/dashboard.html</text>

  <!-- Admin Route -->
  <path d="M 472 467 L 550 467 L 550 585 L 255 585" class="arrow"/>
  <text x="490" y="500" class="branch-lbl">[ADMIN]</text>
  <rect x="55" y="565" width="200" height="44" class="act-node"/>
  <text x="155" y="581" class="node-txt">Dashboard Administrator</text>
  <text x="155" y="596" class="node-sub">/pages/admin/dashboard.html</text>

  <!-- End Node -->
  <path d="M 155 609 L 155 635" class="arrow"/>
  <circle cx="155" cy="645" r="14" class="stop-outer"/>
  <circle cx="155" cy="645" r="9" class="stop-inner"/>

</svg>
