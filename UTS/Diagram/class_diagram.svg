<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 860" width="100%" height="100%">
  <defs>
    <style>
      .bg { fill: #f8fafc; }
      .header-box { fill: #0f172a; rx: 8; }
      .header-title { font-family: 'Segoe UI', system-ui, sans-serif; font-size: 18px; font-weight: 700; fill: #ffffff; text-anchor: middle; }
      .header-sub { font-family: 'Segoe UI', system-ui, sans-serif; font-size: 11.5px; fill: #94a3b8; text-anchor: middle; }
      .class-box { fill: #ffffff; stroke: #cbd5e1; stroke-width: 1.5; rx: 6; }
      .class-hdr { rx: 6; }
      .hdr-blue { fill: #1e3a8a; }
      .hdr-indigo { fill: #312e81; }
      .hdr-amber { fill: #78350f; }
      .hdr-emerald { fill: #064e3b; }
      .hdr-purple { fill: #581c87; }
      .hdr-slate { fill: #334155; }
      .class-name { font-family: 'Segoe UI', system-ui, sans-serif; font-size: 11.5px; font-weight: 700; fill: #ffffff; text-anchor: middle; }
      .attr-txt { font-family: 'Courier New', monospace; font-size: 9.5px; fill: #1e293b; }
      .meth-txt { font-family: 'Courier New', monospace; font-size: 9.5px; fill: #0369a1; }
      .div-line { stroke: #e2e8f0; stroke-width: 1; }
      .rel-solid { stroke: #475569; stroke-width: 1.5; fill: none; marker-end: url(#arrowhead); }
      .rel-dashed { stroke: #64748b; stroke-width: 1.5; fill: none; stroke-dasharray: 4,3; marker-end: url(#arrowhead); }
      .card-txt { font-family: 'Segoe UI', system-ui, sans-serif; font-size: 9px; font-weight: 600; fill: #475569; }
    </style>
    <marker id="arrowhead" markerWidth="7" markerHeight="5" refX="7" refY="2.5" orient="auto">
      <polygon points="0 0, 7 2.5, 0 5" fill="#475569"/>
    </marker>
  </defs>

  <rect width="1100" height="860" class="bg"/>

  <!-- Title Banner -->
  <rect x="30" y="15" width="1040" height="48" class="header-box"/>
  <text x="550" y="36" class="header-title">Class Diagram: Model Analisis &amp; Desain Domain SkillBridge</text>
  <text x="550" y="52" class="header-sub">Pemetaan Berorientasi Objek: Entitas BaaS, Logika Bisnis, dan Layanan AI Microservice</text>

  <!-- CLASS 1: User (Top Center) -->
  <g transform="translate(430, 80)">
    <rect width="240" height="155" class="class-box"/>
    <path d="M 0 6 A 6 6 0 0 1 6 0 L 234 0 A 6 6 0 0 1 240 6 L 240 24 L 0 24 Z" class="hdr-blue"/>
    <text x="120" y="16" class="class-name">User (Central Identity)</text>
    <text x="10" y="38" class="attr-txt">- id: UUID</text>
    <text x="10" y="52" class="attr-txt">- email: String</text>
    <text x="10" y="66" class="attr-txt">- name: String</text>
    <text x="10" y="80" class="attr-txt">- role: UserRole</text>
    <text x="10" y="94" class="attr-txt">- is_verified: Boolean</text>
    <line x1="0" y1="102" x2="240" y2="102" class="div-line"/>
    <text x="10" y="118" class="meth-txt">+ register(payload): Session</text>
    <text x="10" y="132" class="meth-txt">+ login(creds): JWTToken</text>
    <text x="10" y="146" class="meth-txt">+ updateProfile(data): Void</text>
  </g>

  <!-- CLASS 2: StudentProfile (Left of User) -->
  <g transform="translate(50, 80)">
    <rect width="240" height="155" class="class-box"/>
    <path d="M 0 6 A 6 6 0 0 1 6 0 L 234 0 A 6 6 0 0 1 240 6 L 240 24 L 0 24 Z" class="hdr-indigo"/>
    <text x="120" y="16" class="class-name">StudentProfile</text>
    <text x="10" y="38" class="attr-txt">- user_id: UUID (FK)</text>
    <text x="10" y="52" class="attr-txt">- institution: String</text>
    <text x="10" y="66" class="attr-txt">- portfolio_score: Integer</text>
    <text x="10" y="80" class="attr-txt">- skills: Array&lt;String&gt;</text>
    <text x="10" y="94" class="attr-txt">- certificates: JSONB</text>
    <line x1="0" y1="102" x2="240" y2="102" class="div-line"/>
    <text x="10" y="118" class="meth-txt">+ uploadCV(file): Void</text>
    <text x="10" y="132" class="meth-txt">+ updateSkills(tags): Void</text>
    <text x="10" y="146" class="meth-txt">+ getMaskedData(): Dict</text>
  </g>

  <!-- CLASS 3: UmkmProfile (Right of User) -->
  <g transform="translate(810, 80)">
    <rect width="240" height="155" class="class-box"/>
    <path d="M 0 6 A 6 6 0 0 1 6 0 L 234 0 A 6 6 0 0 1 240 6 L 240 24 L 0 24 Z" class="hdr-amber"/>
    <text x="120" y="16" class="class-name">UmkmProfile</text>
    <text x="10" y="38" class="attr-txt">- user_id: UUID (FK)</text>
    <text x="10" y="52" class="attr-txt">- company_name: String</text>
    <text x="10" y="66" class="attr-txt">- industry: String</text>
    <text x="10" y="80" class="attr-txt">- location: String</text>
    <text x="10" y="94" class="attr-txt">- business_scale: String</text>
    <line x1="0" y1="102" x2="240" y2="102" class="div-line"/>
    <text x="10" y="118" class="meth-txt">+ updateBusiness(): Void</text>
    <text x="10" y="132" class="meth-txt">+ verifyLegalDocs(): Boolean</text>
    <text x="10" y="146" class="meth-txt">+ getPublicInfo(): Dict</text>
  </g>

  <!-- Associations User <-> Profiles -->
  <path d="M 430 145 L 290 145" class="rel-solid"/>
  <text x="350" y="140" class="card-txt">1 : 1</text>
  <path d="M 670 145 L 810 145" class="rel-solid"/>
  <text x="730" y="140" class="card-txt">1 : 1</text>

  <!-- CLASS 4: Project (Center Middle) -->
  <g transform="translate(430, 280)">
    <rect width="240" height="175" class="class-box"/>
    <path d="M 0 6 A 6 6 0 0 1 6 0 L 234 0 A 6 6 0 0 1 240 6 L 240 24 L 0 24 Z" class="hdr-amber"/>
    <text x="120" y="16" class="class-name">Project</text>
    <text x="10" y="38" class="attr-txt">- id: UUID</text>
    <text x="10" y="52" class="attr-txt">- owner_id: UUID (FK)</text>
    <text x="10" y="66" class="attr-txt">- category_id: UUID (FK)</text>
    <text x="10" y="80" class="attr-txt">- title: String</text>
    <text x="10" y="94" class="attr-txt">- stipend: String</text>
    <text x="10" y="108" class="attr-txt">- status: ProjectStatus</text>
    <text x="10" y="122" class="attr-txt">- deliverables: JSONB</text>
    <line x1="0" y1="130" x2="240" y2="130" class="div-line"/>
    <text x="10" y="146" class="meth-txt">+ publish(): Void</text>
    <text x="10" y="160" class="meth-txt">+ editBrief(data): Void</text>
  </g>

  <!-- Association User -> Project -->
  <path d="M 550 235 L 550 280" class="rel-solid"/>
  <text x="560" y="255" class="card-txt">1 : N</text>

  <!-- CLASS 5: ProjectApplication (Left Middle) -->
  <g transform="translate(50, 280)">
    <rect width="240" height="175" class="class-box"/>
    <path d="M 0 6 A 6 6 0 0 1 6 0 L 234 0 A 6 6 0 0 1 240 6 L 240 24 L 0 24 Z" class="hdr-purple"/>
    <text x="120" y="16" class="class-name">ProjectApplication</text>
    <text x="10" y="38" class="attr-txt">- id: UUID</text>
    <text x="10" y="52" class="attr-txt">- project_id: UUID (FK)</text>
    <text x="10" y="66" class="attr-txt">- student_id: UUID (FK)</text>
    <text x="10" y="80" class="attr-txt">- status: AppStatus</text>
    <text x="10" y="94" class="attr-txt">- pitch: String</text>
    <text x="10" y="108" class="attr-txt">- ai_match_percent: Integer</text>
    <text x="10" y="122" class="attr-txt">- ai_rationale: String</text>
    <line x1="0" y1="130" x2="240" y2="130" class="div-line"/>
    <text x="10" y="146" class="meth-txt">+ submit(pitch): Void</text>
    <text x="10" y="160" class="meth-txt">+ accept(): Workspace</text>
  </g>

  <!-- Association Project <-> Application -->
  <path d="M 430 350 L 290 350" class="rel-solid"/>
  <text x="350" y="342" class="card-txt">1 : N</text>

  <!-- CLASS 6: AIMatchingService (Right Middle) -->
  <g transform="translate(810, 280)">
    <rect width="240" height="175" class="class-box"/>
    <path d="M 0 6 A 6 6 0 0 1 6 0 L 234 0 A 6 6 0 0 1 240 6 L 240 24 L 0 24 Z" class="hdr-purple"/>
    <text x="120" y="16" class="class-name">AIMatchingService (Python)</text>
    <text x="10" y="38" class="attr-txt">- model: 'gemini-2.5-flash'</text>
    <text x="10" y="52" class="attr-txt">- api_key: String (Vault)</text>
    <text x="10" y="66" class="attr-txt">- temperature: 0.2</text>
    <line x1="0" y1="78" x2="240" y2="78" class="div-line"/>
    <text x="10" y="96" class="meth-txt">+ evaluateMatch(c, p): Dict</text>
    <text x="10" y="112" class="meth-txt">+ parseGeminiJSON(raw): Dict</text>
    <text x="10" y="128" class="meth-txt">+ jaccardFallback(s, r): Dict</text>
    <text x="10" y="144" class="meth-txt">+ sanitizePayload(d): Dict</text>
    <text x="10" y="160" class="meth-txt">+ validateSchema(): Boolean</text>
  </g>

  <!-- Dependency Application ..> AIMatchingService -->
  <path d="M 290 375 L 810 375" class="rel-dashed"/>
  <text x="530" y="370" class="card-txt">&lt;&lt;invokes REST API&gt;&gt;</text>

  <!-- CLASS 7: Workspace (Center Bottom) -->
  <g transform="translate(430, 500)">
    <rect width="240" height="155" class="class-box"/>
    <path d="M 0 6 A 6 6 0 0 1 6 0 L 234 0 A 6 6 0 0 1 240 6 L 240 24 L 0 24 Z" class="hdr-emerald"/>
    <text x="120" y="16" class="class-name">Workspace</text>
    <text x="10" y="38" class="attr-txt">- id: UUID</text>
    <text x="10" y="52" class="attr-txt">- project_id: UUID (FK)</text>
    <text x="10" y="66" class="attr-txt">- student_id, umkm_id: UUID</text>
    <text x="10" y="80" class="attr-txt">- progress_percent: Integer</text>
    <text x="10" y="94" class="attr-txt">- deliverable_url: String</text>
    <line x1="0" y1="102" x2="240" y2="102" class="div-line"/>
    <text x="10" y="118" class="meth-txt">+ recalculateProgress(): Int</text>
    <text x="10" y="132" class="meth-txt">+ submitDeliverable(url): Void</text>
    <text x="10" y="146" class="meth-txt">+ complete(): Void</text>
  </g>

  <!-- Association Project -> Workspace -->
  <path d="M 550 455 L 550 500" class="rel-solid"/>
  <text x="560" y="475" class="card-txt">1 : 1</text>

  <!-- CLASS 8: ProjectTask (Left Bottom) -->
  <g transform="translate(50, 500)">
    <rect width="240" height="145" class="class-box"/>
    <path d="M 0 6 A 6 6 0 0 1 6 0 L 234 0 A 6 6 0 0 1 240 6 L 240 24 L 0 24 Z" class="hdr-emerald"/>
    <text x="120" y="16" class="class-name">ProjectTask</text>
    <text x="10" y="38" class="attr-txt">- id: UUID</text>
    <text x="10" y="52" class="attr-txt">- workspace_id: UUID (FK)</text>
    <text x="10" y="66" class="attr-txt">- title: String</text>
    <text x="10" y="80" class="attr-txt">- completed: Boolean</text>
    <text x="10" y="94" class="attr-txt">- due_date: DateTime</text>
    <line x1="0" y1="102" x2="240" y2="102" class="div-line"/>
    <text x="10" y="118" class="meth-txt">+ toggleComplete(): Boolean</text>
    <text x="10" y="132" class="meth-txt">+ broadcastCDC(): Void</text>
  </g>

  <!-- Association Workspace -> Task -->
  <path d="M 430 565 L 290 565" class="rel-solid"/>
  <text x="350" y="557" class="card-txt">1 : N</text>

  <!-- CLASS 9: Message (Right Bottom) -->
  <g transform="translate(810, 500)">
    <rect width="240" height="145" class="class-box"/>
    <path d="M 0 6 A 6 6 0 0 1 6 0 L 234 0 A 6 6 0 0 1 240 6 L 240 24 L 0 24 Z" class="hdr-blue"/>
    <text x="120" y="16" class="class-name">Message (Realtime CDC)</text>
    <text x="10" y="38" class="attr-txt">- id: UUID</text>
    <text x="10" y="52" class="attr-txt">- workspace_id: UUID (FK)</text>
    <text x="10" y="66" class="attr-txt">- sender_id, receiver_id</text>
    <text x="10" y="80" class="attr-txt">- text: String</text>
    <text x="10" y="94" class="attr-txt">- created_at: DateTime</text>
    <line x1="0" y1="102" x2="240" y2="102" class="div-line"/>
    <text x="10" y="118" class="meth-txt">+ send(): Void</text>
    <text x="10" y="132" class="meth-txt">+ listenRealtime(): Stream</text>
  </g>

  <!-- Association Workspace -> Message -->
  <path d="M 670 565 L 810 565" class="rel-solid"/>
  <text x="730" y="557" class="card-txt">1 : N</text>

  <!-- CLASS 10: Review (Bottom Row Center) -->
  <g transform="translate(430, 690)">
    <rect width="240" height="135" class="class-box"/>
    <path d="M 0 6 A 6 6 0 0 1 6 0 L 234 0 A 6 6 0 0 1 240 6 L 240 24 L 0 24 Z" class="hdr-amber"/>
    <text x="120" y="16" class="class-name">Review</text>
    <text x="10" y="38" class="attr-txt">- id: UUID</text>
    <text x="10" y="52" class="attr-txt">- project_id: UUID (FK)</text>
    <text x="10" y="66" class="attr-txt">- author_id, target_id: UUID</text>
    <text x="10" y="80" class="attr-txt">- rating: Integer (1-5)</text>
    <text x="10" y="94" class="attr-txt">- comment: String</text>
    <line x1="0" y1="102" x2="240" y2="102" class="div-line"/>
    <text x="10" y="120" class="meth-txt">+ submitTwoWayReview(): Void</text>
  </g>

  <!-- Association Workspace/Project -> Review -->
  <path d="M 550 655 L 550 690" class="rel-solid"/>
  <text x="560" y="675" class="card-txt">1 : N</text>

</svg>
