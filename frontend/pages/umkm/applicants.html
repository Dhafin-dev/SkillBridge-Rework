
<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Applicants — SkillBridge</title>
<link rel="stylesheet" href="../../assets/css/style.css">
<link rel="stylesheet" href="../../assets/css/components.css">
<style>
.sbap-header{display:flex;align-items:center;justify-content:space-between;gap:20px;flex-wrap:wrap;margin-bottom:30px}
.sbap-header h1{font-size:clamp(26px,3vw,36px);font-weight:800;color:#0f172a;margin:0 0 6px}
.sbap-header p{font-size:14px;color:#64748b;margin:0;line-height:1.6}
.sbap-filters{display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.sbap-count{background:#eff6ff;color:#2563eb;padding:9px 15px;border-radius:999px;font-size:12px;font-weight:800}
.sbap-select{min-width:250px;max-width:100%;border:1px solid #dbe3ef;background:#fff;border-radius:12px;padding:12px 16px;font:inherit;font-size:13px;color:#334155}
.sbap-card{background:#fff;border:1px solid #e2e8f0;border-radius:18px;padding:25px;margin-bottom:18px}
.sbap-top{display:flex;align-items:center;justify-content:space-between;gap:14px;flex-wrap:wrap}
.sbap-person{display:flex;align-items:center;gap:14px}
.sbap-avatar{display:flex;align-items:center;justify-content:center;width:48px;height:48px;border-radius:50%;background:#eff6ff;color:#2563eb;font-weight:800;font-size:20px;flex-shrink:0}
.sbap-person h2{font-size:17px;font-weight:800;color:#0f172a;margin:0 0 5px}
.sbap-person p{font-size:12px;color:#64748b;margin:0}
.sbap-status{display:inline-block;padding:7px 12px;border-radius:999px;font-size:11px;font-weight:800;background:#fef3c7;color:#92400e}
.sbap-status.accepted{background:#dcfce7;color:#15803d}
.sbap-status.rejected{background:#fee2e2;color:#b91c1c}
.sbap-section{margin-top:20px}
.sbap-section strong{font-size:12px;color:#475569}
.sbap-skills{display:flex;gap:7px;flex-wrap:wrap;margin-top:9px}
.sbap-skill{font-size:11px;color:#475569;background:#f1f5f9;padding:6px 10px;border-radius:7px}
.sbap-letter{margin-top:18px;padding:18px;background:#f8fafc;border:1px solid #f1f5f9;border-radius:12px;font-size:13px;line-height:1.7;color:#475569;white-space:pre-wrap;overflow-wrap:anywhere}
.sbap-letter strong{display:block;margin-bottom:7px;color:#0f172a}
.sbap-actions{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin-top:20px;padding-top:20px;border-top:1px solid #e2e8f0}
.sbap-btn{border:0;border-radius:10px;padding:12px 17px;font:inherit;font-size:12px;font-weight:800;cursor:pointer;background:#2563eb;color:#fff;text-decoration:none;display:inline-flex;align-items:center;justify-content:center}
.sbap-btn.reject{background:#fef2f2;color:#dc2626;border:1px solid #fecaca}
.sbap-btn.workspace{background:#eff6ff;color:#2563eb}
.sbap-btn:disabled{opacity:.55;cursor:wait}
.sbap-state{background:#fff;border:1px dashed #cbd5e1;border-radius:20px;text-align:center;padding:65px 20px;color:#64748b}
.sbap-state h3{font-size:20px;color:#0f172a;margin:0 0 8px}
.sbap-state p{font-size:13px;line-height:1.7}
.sbap-error{background:#fef2f2;color:#b91c1c;border:1px solid #fecaca;border-radius:12px;padding:16px;margin-bottom:20px;white-space:pre-wrap;font-size:13px}
@media(max-width:650px){.sbap-card{padding:19px}.sbap-select{width:100%}.sbap-filters{width:100%}}
</style>
</head>
<body class="dashboard-body">
<div class="dashboard-layout">
  <aside class="dashboard-sidebar" id="shared-sidebar"></aside>
  <main class="dashboard-main">
    <header class="dashboard-topbar" id="shared-topbar"></header>
    <div class="dashboard-canvas">
      <div class="sbap-header">
        <div>
          <h1>Evaluasi Pelamar Mahasiswa</h1>
          <p>Tinjau lamaran mahasiswa dan pilih kandidat yang sesuai untuk proyek UMKM Anda.</p>
        </div>
        <div class="sbap-filters">
          <span class="sbap-count" id="applicants-count-badge">0 Pelamar</span>
          <select id="project-selector" class="sbap-select">
            <option value="">Memuat proyek...</option>
          </select>
        </div>
      </div>

      <div id="applicants-error" hidden></div>
      <div id="applicants-list-container">
        <div class="sbap-state">
          <h3>Memuat data pelamar...</h3>
          <p>Mengambil lamaran dari Supabase.</p>
        </div>
      </div>
    </div>
  </main>
</div>

<script src="../../assets/vendor/supabase.js"></script>
<script src="../../assets/js/config.js"></script>
<script src="../../assets/js/supabase.js"></script>
<script src="../../assets/js/toast.js"></script>
<script src="../../assets/js/auth.js"></script>
<script src="../../assets/js/database.js"></script>
<script src="../../assets/js/settings.js"></script>
<script src="../../assets/js/layout.js"></script>

<script>
(() => {
  "use strict";

  const db = window.supabaseClient;
  const auth = window.SkillBridgeAuth;
  const selector = document.getElementById("project-selector");
  const container = document.getElementById("applicants-list-container");
  const badge = document.getElementById("applicants-count-badge");
  const errorBox = document.getElementById("applicants-error");

  let owner = null;
  let myProjects = [];
  let currentProject = null;
  let applicants = [];
  let workspaces = [];
  let busy = false;

  const esc = value => String(value ?? "")
    .replace(/&/g, "&amp;")
    .replace(/</g, "&lt;")
    .replace(/>/g, "&gt;")
    .replace(/"/g, "&quot;")
    .replace(/'/g, "&#39;");

  function showError(text) {
    errorBox.hidden = false;
    errorBox.className = "sbap-error";
    errorBox.textContent = text;
  }

  function clearError() {
    errorBox.hidden = true;
    errorBox.textContent = "";
  }

  function showState(title, description) {
    container.innerHTML = `
      <div class="sbap-state">
        <h3>${esc(title)}</h3>
        <p>${esc(description)}</p>
      </div>`;
  }

  function findWorkspace(app) {
    return workspaces.find(ws =>
      String(ws.project_id) === String(app.project_id) &&
      String(ws.student_id) === String(app.student_id)
    );
  }

  function statusLabel(status) {
    const value = String(status || "pending").toLowerCase();
    if (value === "accepted") return "Diterima";
    if (value === "rejected") return "Ditolak";
    return "Menunggu Keputusan";
  }

  function renderApplicants() {
    badge.textContent = `${applicants.length} Pelamar`;

    if (!applicants.length) {
      showState(
        "Belum Ada Pelamar",
        "Belum ada lamaran mahasiswa untuk proyek yang dipilih."
      );
      return;
    }

    container.innerHTML = applicants.map(app => {
      const status = String(app.status || "pending").toLowerCase();
      const name = app.student_name || "Mahasiswa";
      const university = app.student_university || "Universitas belum diisi";
      const skills = Array.isArray(app.student_skills)
        ? app.student_skills : [];
      const workspace = findWorkspace(app);

      let actions = "";

      if (status === "pending") {
        actions = `
          <button type="button" class="sbap-btn"
            data-decision="accepted" data-id="${esc(app.id)}">
            Terima &amp; Mulai Kolaborasi
          </button>
          <button type="button" class="sbap-btn reject"
            data-decision="rejected" data-id="${esc(app.id)}">
            Tolak Lamaran
          </button>`;
      } else if (status === "accepted") {
        actions = workspace ? `
          <a class="sbap-btn workspace"
             href="review-workspace.html?id=${encodeURIComponent(workspace.id)}">
            ${workspace.review_state === "submitted"
              ? "Review Final Project"
              : "Buka Workspace"} →
          </a>` : `
          <span style="font-size:12px;color:#64748b">
            Lamaran diterima. Workspace belum tersedia.
          </span>`;
      } else {
        actions = `
          <span style="font-size:12px;color:#64748b">
            Lamaran ini sudah ditolak.
          </span>`;
      }

      return `
        <article class="sbap-card">
          <div class="sbap-top">
            <div class="sbap-person">
              <div class="sbap-avatar">${esc(name.charAt(0).toUpperCase())}</div>
              <div>
                <h2>${esc(name)}</h2>
                <p>${esc(university)}</p>
              </div>
            </div>
            <span class="sbap-status ${status === "accepted"
              ? "accepted" : status === "rejected" ? "rejected" : ""}">
              ${statusLabel(status)}
            </span>
          </div>

          <div class="sbap-section">
            <strong>KEAHLIAN MAHASISWA</strong>
            <div class="sbap-skills">
              ${skills.length ? skills.map(skill =>
                `<span class="sbap-skill">${esc(skill)}</span>`
              ).join("") : `<span class="sbap-skill">Belum diisi</span>`}
            </div>
          </div>

          <div class="sbap-letter">
            <strong>Surat Pengantar &amp; Solusi</strong>
            ${esc(app.cover_letter || "Mahasiswa belum memberikan surat pengantar.")}
          </div>

          ${app.portfolio_url ? `
            <div class="sbap-section">
              <a href="${esc(app.portfolio_url)}" target="_blank"
                rel="noopener noreferrer"
                style="color:#2563eb;font-size:13px;font-weight:700">
                Lihat Portfolio →
              </a>
            </div>` : ""}

          <div class="sbap-actions">${actions}</div>
        </article>`;
    }).join("");
  }

  async function loadApplicants(projectId) {
    clearError();
    currentProject = myProjects.find(p => String(p.id) === String(projectId));

    if (!currentProject) {
      applicants = [];
      badge.textContent = "0 Pelamar";
      showState("Pilih Proyek", "Pilih proyek untuk melihat daftar mahasiswa.");
      return;
    }

    showState("Memuat data pelamar...", "Mengambil lamaran dari Supabase.");

    try {
      // View aplikasi asli, bukan data dummy.
      const result = await db
        .from("applications_with_student")
        .select("*")
        .eq("project_id", currentProject.id)
        .order("created_at", { ascending: false });

      if (result.error) throw result.error;
      applicants = result.data || [];

      const workspaceResult = await db
        .from("workspaces")
        .select("id,project_id,student_id,umkm_id,status,review_state")
        .eq("project_id", currentProject.id)
        .eq("umkm_id", owner.id);

      if (workspaceResult.error) {
        console.warn("[Applicants Workspaces]", workspaceResult.error);
        workspaces = [];
        showError("Daftar pelamar berhasil dimuat, tetapi workspace gagal dibaca: " +
          workspaceResult.error.message);
      } else {
        workspaces = workspaceResult.data || [];
      }

      renderApplicants();
    } catch (error) {
      console.error("[SkillBridge Applicants]", error);
      showError("Gagal memuat pelamar: " + error.message);
      container.innerHTML = "";
    }
  }

  async function handleDecision(id, decision) {
    if (busy) return;

    const app = applicants.find(item => String(item.id) === String(id));
    if (!app || String(app.status).toLowerCase() !== "pending") return;

    const accept = decision === "accepted";
    const confirmed = confirm(accept
      ? `Terima ${app.student_name || "mahasiswa"} untuk proyek ini?`
      : `Tolak lamaran ${app.student_name || "mahasiswa"}?`);

    if (!confirmed) return;

    busy = true;

    try {
      const result = await window.SkillBridgeDB.updateApplicationStatus(
        app.id, decision
      );

      if (result?.error) throw result.error;

      await loadApplicants(currentProject.id);
      if (window.toast?.success) {
        window.toast.success(accept
          ? "Lamaran diterima. Workspace kolaborasi dibuat jika trigger aktif."
          : "Lamaran ditolak.");
      }
    } catch (error) {
      console.error("[Applicant Decision]", error);
      showError("Gagal memproses lamaran: " + error.message);
    } finally {
      busy = false;
    }
  }

  async function init() {
    try {
      if (!db || !auth) throw new Error("Supabase atau Auth belum tersedia.");

      await auth.ready();
      owner = await auth.requireAuth("umkm");
      if (!owner?.id) return;

      // Hanya ambil proyek milik UMKM yang sedang login.
      const result = await db
        .from("projects")
        .select("id,title,status,owner_id")
        .eq("owner_id", owner.id)
        .order("created_at", { ascending: false });

      if (result.error) throw result.error;

      myProjects = result.data || [];

      if (!myProjects.length) {
        selector.innerHTML = `<option value="">Belum ada proyek</option>`;
        showState("Belum Ada Proyek", "Buat proyek dahulu melalui Create Project.");
        return;
      }

      const requested = new URLSearchParams(location.search)
        .get("project_id");

      const selected = myProjects.some(p => String(p.id) === String(requested))
        ? requested : myProjects[0].id;

      selector.innerHTML = myProjects.map(project => `
        <option value="${esc(project.id)}"
          ${String(project.id) === String(selected) ? "selected" : ""}>
          ${esc(project.title)}
        </option>
      `).join("");

      await loadApplicants(selected);

    } catch (error) {
      console.error("[Applicants Init]", error);
      showError("Gagal membuka halaman Applicants: " + error.message);
      container.innerHTML = "";
    }
  }

  selector.addEventListener("change", () => {
    loadApplicants(selector.value);
  });

  container.addEventListener("click", event => {
    const button = event.target.closest("[data-decision]");
    if (!button) return;

    handleDecision(button.dataset.id, button.dataset.decision);
  });

  if (document.readyState === "loading") {
    document.addEventListener("DOMContentLoaded", init, { once: true });
  } else {
    init();
  }
})();
</script>
</body>
</html>
