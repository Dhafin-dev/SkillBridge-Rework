<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 1020" width="100%" height="100%">
  <defs>
    <style>
      .bg { fill: #f8fafc; }
      .header-box { fill: #1e1b4b; rx: 8; }
      .header-title { font-family: 'Segoe UI', system-ui, sans-serif; font-size: 18px; font-weight: 700; fill: #ffffff; text-anchor: middle; }
      .header-sub { font-family: 'Segoe UI', system-ui, sans-serif; font-size: 12px; fill: #c7d2fe; text-anchor: middle; }
      .swimlane { fill: #ffffff; stroke: #cbd5e1; stroke-width: 1.5; }
      .lane-title-std { font-family: 'Segoe UI', system-ui, sans-serif; font-size: 13px; font-weight: 700; fill: #312e81; text-anchor: middle; }
      .lane-title-sys { font-family: 'Segoe UI', system-ui, sans-serif; font-size: 13px; font-weight: 700; fill: #065f46; text-anchor: middle; }
      .lane-title-umkm { font-family: 'Segoe UI', system-ui, sans-serif; font-size: 13px; font-weight: 700; fill: #92400e; text-anchor: middle; }
      .act-node-std { fill: #eef2ff; stroke: #4f46e5; stroke-width: 1.5; rx: 8; }
      .act-node-sys { fill: #ecfdf5; stroke: #10b981; stroke-width: 1.5; rx: 8; }
      .act-node-umkm { fill: #fffbeb; stroke: #f59e0b; stroke-width: 1.5; rx: 8; }
      .act-node-ai { fill: #faf5ff; stroke: #8b5cf6; stroke-width: 1.5; rx: 8; }
      .node-title { font-family: 'Segoe UI', system-ui, sans-serif; font-size: 11px; font-weight: 700; fill: #0f172a; text-anchor: middle; }
      .node-desc { font-family: 'Segoe UI', system-ui, sans-serif; font-size: 9.5px; fill: #475569; text-anchor: middle; }
      .decision { fill: #fef3c7; stroke: #d97706; stroke-width: 1.5; }
      .dec-text { font-family: 'Segoe UI', system-ui, sans-serif; font-size: 10px; font-weight: 600; fill: #92400e; text-anchor: middle; dominant-baseline: middle; }
      .start-node { fill: #10b981; stroke: #047857; stroke-width: 2.5; }
      .stop-outer { fill: none; stroke: #ef4444; stroke-width: 2; }
      .stop-inner { fill: #ef4444; }
      .arrow { stroke: #64748b; stroke-width: 1.5; fill: none; marker-end: url(#arrowhead); }
      .arrow-reject { stroke: #ef4444; stroke-width: 1.5; fill: none; marker-end: url(#arrowhead-red); stroke-dasharray: 4,3; }
      .branch-lbl { font-family: 'Segoe UI', system-ui, sans-serif; font-size: 9.5px; font-weight: 700; fill: #059669; }
      .branch-lbl-red { font-family: 'Segoe UI', system-ui, sans-serif; font-size: 9.5px; font-weight: 700; fill: #dc2626; }
    </style>
    <marker id="arrowhead" markerWidth="7" markerHeight="5" refX="7" refY="2.5" orient="auto">
      <polygon points="0 0, 7 2.5, 0 5" fill="#64748b"/>
    </marker>
    <marker id="arrowhead-red" markerWidth="7" markerHeight="5" refX="7" refY="2.5" orient="auto">
      <polygon points="0 0, 7 2.5, 0 5" fill="#ef4444"/>
    </marker>
  </defs>

  <!-- Background -->
  <rect width="920" height="1020" class="bg"/>

  <!-- Main Banner -->
  <rect x="25" y="15" width="870" height="50" class="header-box"/>
  <text x="460" y="37" class="header-title">Gambar 2.1 Alur Kerja Mahasiswa (Activity Diagram)</text>
  <text x="460" y="53" class="header-sub">Platform SkillBridge: Dari Registrasi, Matching AI, Workspace, hingga Endorsement Portofolio</text>

  <!-- Swimlanes -->
  <!-- Lane 1: Mahasiswa -->
  <rect x="25" y="75" width="280" height="920" class="swimlane"/>
  <rect x="25" y="75" width="280" height="34" fill="#e0e7ff" stroke="#cbd5e1" stroke-width="1.5"/>
  <text x="165" y="97" class="lane-title-std">Mahasiswa (Talenta Digital)</text>

  <!-- Lane 2: Sistem Platform & AI -->
  <rect x="305" y="75" width="310" height="920" class="swimlane"/>
  <rect x="305" y="75" width="310" height="34" fill="#d1fae5" stroke="#cbd5e1" stroke-width="1.5"/>
  <text x="460" y="97" class="lane-title-sys">Sistem Platform &amp; LLM Matchmaking</text>

  <!-- Lane 3: Pemilik UMKM -->
  <rect x="615" y="75" width="280" height="920" class="swimlane"/>
  <rect x="615" y="75" width="280" height="34" fill="#fef3c7" stroke="#cbd5e1" stroke-width="1.5"/>
  <text x="755" y="97" class="lane-title-umkm">Pemilik UMKM (Mitra Industri)</text>

  <!-- 1. Start Node -->
  <circle cx="165" cy="130" r="10" class="start-node"/>

  <!-- Step 1: Mahasiswa Registrasi & Isi Profil -->
  <path d="M 165 140 L 165 160" class="arrow"/>
  <rect x="55" y="160" width="220" height="42" class="act-node-std"/>
  <text x="165" y="177" class="node-title">1. Registrasi &amp; Lengkapi Profil</text>
  <text x="165" y="192" class="node-desc">Isi keahlian, riwayat, unggah CV/portofolio</text>

  <!-- Flow to System: LLM Resume Extraction -->
  <path d="M 275 181 L 340 181" class="arrow"/>
  <rect x="340" y="160" width="240" height="42" class="act-node-ai"/>
  <text x="460" y="177" class="node-title">2. LLM Resume &amp; Skill Parsing</text>
  <text x="460" y="192" class="node-desc">Ekstraksi tag kompetensi terstruktur &amp; validasi</text>

  <!-- Decision: Profil Valid? -->
  <path d="M 460 202 L 460 225" class="arrow"/>
  <polygon points="460,225 515,250 460,275 405,250" class="decision"/>
  <text x="460" y="253" class="dec-text">Valid &amp; Terbaca?</text>

  <!-- Decision No -> Back to Student -->
  <path d="M 405 250 L 165 250 L 165 202" class="arrow-reject"/>
  <text x="260" y="244" class="branch-lbl-red">[Tidak: Perbaiki Profil]</text>

  <!-- Decision Yes -> Masked Profile Stored -->
  <path d="M 460 275 L 460 300" class="arrow"/>
  <text x="468" y="290" class="branch-lbl">[Ya]</text>
  <rect x="340" y="300" width="240" height="42" class="act-node-sys"/>
  <text x="460" y="317" class="node-title">3. Simpan Profil &amp; Data Masking</text>
  <text x="460" y="332" class="node-desc">Informasi kontak disembunyikan (Anonim)</text>

  <!-- Student browses & applies -->
  <path d="M 340 321 L 165 321 L 165 365" class="arrow"/>
  <rect x="55" y="365" width="220" height="42" class="act-node-std"/>
  <text x="165" y="382" class="node-title">4. Jelajah Marketplace Proyek</text>
  <text x="165" y="397" class="node-desc">Filter brief proyek &amp; ajukan 1-click apply</text>

  <!-- System runs AI Matchmaking -->
  <path d="M 275 386 L 340 386" class="arrow"/>
  <rect x="340" y="365" width="240" height="42" class="act-node-ai"/>
  <text x="460" y="382" class="node-title">5. Eksekusi AI Matchmaking</text>
  <text x="460" y="397" class="node-desc">Hitung skor (%), keselarasan &amp; saran aksi</text>

  <!-- Sent to UMKM -->
  <path d="M 580 386 L 645 386" class="arrow"/>
  <rect x="645" y="365" width="220" height="42" class="act-node-umkm"/>
  <text x="755" y="382" class="node-title">6. UMKM Tinjau Pelamar</text>
  <text x="755" y="397" class="node-desc">Evaluasi skor kecocokan &amp; rasionalisasi AI</text>

  <!-- Decision UMKM: Terima? -->
  <path d="M 755 407 L 755 435" class="arrow"/>
  <polygon points="755,435 810,460 755,485 700,460" class="decision"/>
  <text x="755" y="463" class="dec-text">Terima Lamaran?</text>

  <!-- Decision: Tolak -> Notifikasi & Selesai -->
  <path d="M 700 460 L 460 460 L 460 495" class="arrow-reject"/>
  <text x="540" y="454" class="branch-lbl-red">[Tolak: Kirim Notifikasi]</text>
  <rect x="340" y="495" width="240" height="34" class="act-node-sys"/>
  <text x="460" y="516" class="node-title">Notifikasi Penolakan ke Mahasiswa</text>
  <path d="M 340 512 L 165 512 L 165 407" class="arrow"/>

  <!-- Decision: Terima -> Otomatis Buat Workspace -->
  <path d="M 755 485 L 755 550 L 580 550" class="arrow"/>
  <text x="765" y="515" class="branch-lbl">[Ya: Diterima]</text>
  <rect x="340" y="530" width="240" height="42" class="act-node-sys"/>
  <text x="460" y="547" class="node-title">7. Otomatisasi Workspace &amp; Kontak</text>
  <text x="460" y="562" class="node-desc">Generate checklist milestone &amp; buka kontak</text>

  <!-- Mahasiswa Mengerjakan Tugas di Workspace -->
  <path d="M 340 551 L 165 551 L 165 600" class="arrow"/>
  <rect x="55" y="600" width="220" height="42" class="act-node-std"/>
  <text x="165" y="617" class="node-title">8. Kolaborasi di Workspace</text>
  <text x="165" y="632" class="node-desc">Centang checklist tugas &amp; koordinasi chat</text>

  <!-- Submit Deliverables -->
  <path d="M 165 642 L 165 670" class="arrow"/>
  <rect x="55" y="670" width="220" height="42" class="act-node-std"/>
  <text x="165" y="687" class="node-title">9. Unggah Hasil Deliverable</text>
  <text x="165" y="702" class="node-desc">Submit link repository, dokumen / aset desain</text>

  <!-- UMKM Reviews Deliverables -->
  <path d="M 275 691 L 755 691 L 755 725" class="arrow"/>
  <rect x="645" y="725" width="220" height="42" class="act-node-umkm"/>
  <text x="755" y="742" class="node-title">10. Peninjauan Hasil Kerja</text>
  <text x="755" y="757" class="node-desc">Validasi kesesuaian deliverable dengan brief</text>

  <!-- Decision: Sesuai Brief? -->
  <path d="M 755 767 L 755 795" class="arrow"/>
  <polygon points="755,795 810,820 755,845 700,820" class="decision"/>
  <text x="755" y="823" class="dec-text">Sesuai Brief?</text>

  <!-- Need Revision -->
  <path d="M 700 820 L 165 820 L 165 642" class="arrow-reject"/>
  <text x="400" y="813" class="branch-lbl-red">[Perlu Revisi: Catatan Perbaikan via Chat]</text>

  <!-- Approved -> Complete Project -->
  <path d="M 755 845 L 755 870 L 580 870" class="arrow"/>
  <text x="765" y="860" class="branch-lbl">[Setuju]</text>
  <rect x="340" y="850" width="240" height="42" class="act-node-sys"/>
  <text x="460" y="867" class="node-title">11. Status Proyek Selesai</text>
  <text x="460" y="882" class="node-desc">Update skor portofolio &amp; buka form review</text>

  <!-- Rating 2 Arah -->
  <path d="M 340 871 L 165 871 L 165 915" class="arrow"/>
  <rect x="55" y="915" width="220" height="40" class="act-node-std"/>
  <text x="165" y="932" class="node-title">12. Mahasiswa Beri Rating &amp; Ulasan</text>
  <text x="165" y="946" class="node-desc">Beri evaluasi bintang &amp; feedback ke UMKM</text>

  <!-- UMKM also gives review -->
  <path d="M 580 885 L 755 885 L 755 915" class="arrow"/>
  <rect x="645" y="915" width="220" height="40" class="act-node-umkm"/>
  <text x="755" y="932" class="node-title">13. UMKM Beri Rating &amp; Testimoni</text>
  <text x="755" y="946" class="node-desc">Endorsement terverifikasi untuk mahasiswa</text>

  <!-- Final Database Record & Stop Node -->
  <path d="M 165 955 L 165 975 L 435 975" class="arrow"/>
  <path d="M 755 955 L 755 975 L 485 975" class="arrow"/>
  <circle cx="460" cy="975" r="14" class="stop-outer"/>
  <circle cx="460" cy="975" r="9" class="stop-inner"/>

</svg>
