<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login — SkillBridge</title>
  <link rel="stylesheet" href="../../assets/css/style.css">
  <link rel="stylesheet" href="../../assets/css/components.css">
  <style>
    .login-container {
      min-height: calc(100vh - 72px);
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 3rem 1rem;
      background-color: #F8FAFC;
    }

    .login-card {
      width: 100%;
      max-width: 440px;
      background: #FFFFFF;
      border: 1px solid #E2E8F0;
      border-radius: 2rem;
      padding: 2.75rem 2.25rem;
      box-shadow: 0 10px 30px -5px rgba(0, 0, 0, 0.04);
      text-align: center;
    }

    .cap-badge {
      width: 54px;
      height: 54px;
      background-color: #EFF6FF;
      color: #2563EB;
      border-radius: var(--radius-full);
      display: flex;
      align-items: center;
      justify-content: center;
      margin: 0 auto 1.25rem auto;
    }

    .login-title {
      font-size: 2rem;
      font-weight: 800;
      color: #0F172A;
      letter-spacing: -0.02em;
      margin-bottom: 0.35rem;
    }

    .login-subtitle {
      font-size: 0.875rem;
      color: #64748B;
      margin-bottom: 2rem;
    }

    .login-input-group {
      position: relative;
      margin-bottom: 1.25rem;
      text-align: left;
    }

    .login-label {
      display: block;
      font-size: 0.8rem;
      font-weight: 600;
      color: #1E293B;
      margin-bottom: 0.4rem;
    }

    .login-input-box {
      position: relative;
      display: flex;
      align-items: center;
    }

    .login-input-box svg.prefix-icon {
      position: absolute;
      left: 1rem;
      color: #94A3B8;
      pointer-events: none;
    }

    .login-input-box svg.suffix-icon {
      position: absolute;
      right: 1rem;
      color: #94A3B8;
      cursor: pointer;
    }

    .login-input {
      width: 100%;
      background-color: #EFF6FF;
      border: 1px solid #DBEAFE;
      border-radius: 0.875rem;
      padding: 0.8rem 1rem 0.8rem 2.85rem;
      font-family: var(--font-family-base);
      font-size: 0.9rem;
      color: #0F172A;
      outline: none;
      transition: all 0.2s ease;
    }

    .login-input:focus {
      background-color: #FFFFFF;
      border-color: #2563EB;
      box-shadow: 0 0 0 3px rgba(37, 99, 235, 0.15);
    }

    .login-meta-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 1.5rem;
      font-size: 0.8rem;
    }

    .remember-label {
      display: flex;
      align-items: center;
      gap: 0.5rem;
      color: #475569;
      cursor: pointer;
    }

    .forgot-link {
      color: #2563EB;
      font-weight: 600;
      text-decoration: none;
    }

    .forgot-link:hover {
      text-decoration: underline;
    }
  </style>
</head>
<body>

  <!-- Top Navigation (Figma Navbar) -->
  <header class="navbar">
    <div class="container nav-container">
      <a href="../../index.html" class="nav-brand-lockup">
        <div class="nav-brand-logo-icon">
          <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M22 10v6M2 10l10-5 10 5-10 5z"/>
            <path d="M6 12v5c3 3 9 3 12 0v-5"/>
          </svg>
        </div>
        <div class="nav-brand-text">
          <span class="nav-brand-title">SkillBridge</span>
          <span class="nav-brand-sub">Academia × Enterprise</span>
        </div>
      </a>

      <nav>
        <ul class="nav-links">
          <li><a href="../../index.html">Home</a></li>
          <li><a href="../../index.html#about">About</a></li>
          <li><a href="../../index.html#help">Help &amp; FAQ</a></li>
          <li><a href="../projects.html">Market</a></li>
        </ul>
      </nav>

      <div class="nav-actions">
        <a href="login.html" class="nav-login-btn" style="color: #2563EB; font-weight: 700;">Login</a>
        <a href="register.html" class="nav-register-btn">Register</a>
      </div>
    </div>
  </header>

  <!-- Login Main Canvas -->
  <main class="login-container">
    <div class="login-card">
      <div class="cap-badge">
        <svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M22 10v6M2 10l10-5 10 5-10 5z"/>
          <path d="M6 12v5c3 3 9 3 12 0v-5"/>
        </svg>
      </div>

      <h1 class="login-title">Welcome back</h1>
      <p class="login-subtitle">Sign in to continue to your dashboard.</p>

      <form id="loginForm">
        <div class="login-input-group">
          <label class="login-label" for="loginEmail">Email Address</label>
          <div class="login-input-box">
            <svg class="prefix-icon" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <rect width="20" height="16" x="2" y="4" rx="2"/><path d="m22 7-8.97 5.7a1.94 1.94 0 0 1-2.06 0L2 7"/>
            </svg>
            <input type="email" id="loginEmail" class="login-input" placeholder="nama@email.com" required autocomplete="email">
          </div>
        </div>

        <div class="login-input-group">
          <label class="login-label" for="loginPassword">Password</label>
          <div class="login-input-box">
            <svg class="prefix-icon" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <rect width="18" height="11" x="3" y="11" rx="2" ry="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/>
            </svg>
            <input type="password" id="loginPassword" class="login-input" placeholder="••••••••" required autocomplete="current-password">
            <svg class="suffix-icon" id="togglePasswordBtn" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <path d="M2 12s3-7 10-7 10 7 10 7-3 7-10 7-10-7-10-7Z"/><circle cx="12" cy="12" r="3"/>
            </svg>
          </div>
        </div>

        <div class="login-meta-row">
          <label class="remember-label">
            <input type="checkbox" id="rememberMe" checked style="accent-color: #2563EB;">
            <span>Remember me</span>
          </label>
          <a href="javascript:void(0)" onclick="handleForgotPassword()" class="forgot-link">Forgot password?</a>
        </div>

        <button type="submit" class="btn btn-primary btn-block btn-lg" style="border-radius: 0.875rem;">
          Sign In
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5">
            <line x1="5" y1="12" x2="19" y2="12"></line>
            <polyline points="12 5 19 12 12 19"></polyline>
          </svg>
        </button>
      </form>

      <p style="margin-top: 1.75rem; font-size: 0.85rem; color: #64748B;">
        Don't have an account? <a href="register.html" style="color: #2563EB; font-weight: 700;">Register</a>
      </p>
    </div>
  </main>

  <script src="../../assets/js/toast.js"></script>
  <script src="../../assets/js/auth.js"></script>
  <script>
    let activeRole = 'mahasiswa';
    const emailInput = document.getElementById('loginEmail');
    const passwordInput = document.getElementById('loginPassword');
    const togglePasswordBtn = document.getElementById('togglePasswordBtn');

    // Toggle Password Visibility
    togglePasswordBtn.addEventListener('click', () => {
      const isPassword = passwordInput.type === 'password';
      passwordInput.type = isPassword ? 'text' : 'password';
      togglePasswordBtn.style.color = isPassword ? '#2563EB' : '#94A3B8';
    });

    // Forgot Password Flow
    async function handleForgotPassword() {
      const email = prompt('Masukkan email akun Anda untuk menerima tautan pemulihan kata sandi:');
      if (!email || !email.trim()) return;
      const cleanEmail = email.trim();
      if (!cleanEmail.includes('@') || !cleanEmail.includes('.')) {
        window.toast.error('Format email tidak valid.');
        return;
      }
      try {
        if (window.supabaseClient && window.supabaseClient.auth) {
          await window.supabaseClient.auth.resetPasswordForEmail(cleanEmail);
        }
        window.toast.success(`Tautan pemulihan kata sandi telah dikirim ke ${cleanEmail}`);
      } catch (err) {
        window.toast.info(`Instruksi pemulihan telah dikirim ke ${cleanEmail}`);
      }
    }

    // Login Form Submit
    document.getElementById('loginForm').addEventListener('submit', async (e) => {
      e.preventDefault();
      const email = emailInput.value.trim();
      const password = passwordInput.value;

      if (!email || !password) {
        window.toast.error('Silakan isi email dan kata sandi.');
        return;
      }

      const submitBtn = e.target.querySelector('button[type="submit"]');
      const originalText = submitBtn.innerHTML;
      submitBtn.disabled = true;
      submitBtn.innerHTML = 'Memproses autentikasi...';

      try {
        const user = await window.SkillBridgeAuth.login(email, password, activeRole);
        if (!user) {
          window.toast.error('Email atau kata sandi tidak valid.');
          submitBtn.disabled = false;
          submitBtn.innerHTML = originalText;
          return;
        }

        window.toast.success(`Selamat datang kembali, ${user.name || user.email}!`);

        setTimeout(() => {
          const urlParams = new URLSearchParams(window.location.search);
          const redirect = urlParams.get('redirect');
          if (redirect) {
            window.location.href = redirect;
            return;
          }

          if (user.role === 'umkm') {
            window.location.href = '../umkm/dashboard.html';
          } else if (user.role === 'admin') {
            window.location.href = '../admin/dashboard.html';
          } else {
            window.location.href = '../student/dashboard.html';
          }
        }, 700);
      } catch (err) {
        window.toast.error(err.message || 'Gagal masuk. Periksa kembali kredensial Anda.');
        submitBtn.disabled = false;
        submitBtn.innerHTML = originalText;
      }
    });
  </script>
</body>
</html>
